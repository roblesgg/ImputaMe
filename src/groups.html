<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  html, body { width:100%;height:100%; }
  body { border-radius:var(--radius);overflow:hidden; }
  /* Contenedor no-drag + asa de arrastre solo en el título (izquierda): así la X de
     cerrar (arriba a la derecha, no-drag) se pulsa entera. Un botón no-drag con una
     zona drag detrás solo responde en parte. */
  .app { width:100%;height:100%;padding:24px;display:flex;flex-direction:column;gap:14px;position:relative;min-height:0;-webkit-app-region:no-drag; }
  /* El título y la fila de búsqueda no se encogen: así el hueco restante es SIEMPRE
     para la lista, que es la que hace scroll (antes, con muchas secciones, la lista se
     estiraba y empujaba fuera de la ventana en vez de desplazarse). */
  .app-title { font-size:16px;font-weight:700;-webkit-app-region:drag;align-self:flex-start;flex-shrink:0; }
  .groups-topbar { flex-shrink:0; }

  .groups-list { flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:6px; }
  /* Scrollbar algo más visible que el de 4px por defecto, para que se note que hay más
     contenido y se pueda agarrar. */
  .groups-list::-webkit-scrollbar { width:8px; }
  .groups-list::-webkit-scrollbar-thumb { background:color-mix(in srgb, var(--text) 22%, transparent);border-radius:4px; }
  .groups-list::-webkit-scrollbar-thumb:hover { background:color-mix(in srgb, var(--text) 38%, transparent); }

  /* flex-shrink:0 es CLAVE: la lista es un flex-column, así que sin esto las tarjetas se
     comprimen para caber en el alto disponible y, con overflow:hidden, recortan las
     tareas de dentro (se veían cortadas a media línea) en vez de dejar hacer scroll. */
  .group-card { border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg2);overflow:hidden;flex-shrink:0;transition:outline .1s,background .1s; }
  .group-card.drop-target { outline:2px dashed var(--accent);outline-offset:-2px;background:color-mix(in srgb, var(--accent2) 12%, transparent); }
  .group-header {
    display:flex;align-items:center;gap:9px;padding:13px 14px;cursor:pointer;
    -webkit-app-region:no-drag;
  }
  .group-header:hover { background:var(--bg3); }
  .group-name { flex:1;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
  .group-count { font-size:11.5px;color:var(--text2); }
  .group-chevron { color:var(--text2);transition:transform .15s;flex-shrink:0; }
  .group-card.collapsed .group-chevron { transform:rotate(-90deg); }
  .group-del {
    background:transparent;border:none;color:var(--text2);width:24px;height:24px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0;transition:all .12s;-webkit-app-region:no-drag;
  }
  .group-header:hover .group-del { opacity:1; }
  .group-del:hover { background:rgba(248,113,113,.2);color:var(--danger); }
  .group-edit {
    background:transparent;border:none;color:var(--text2);width:24px;height:24px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0;transition:all .12s;-webkit-app-region:no-drag;
  }
  .group-header:hover .group-edit { opacity:1; }
  .group-edit:hover { background:var(--bg3);color:var(--accent); }
  /* Solo en orden personalizado: asa para arrastrar la sección entera. */
  .group-grip { color:var(--text2);opacity:.45;flex-shrink:0;cursor:grab;display:none; }
  .group-card.sortable .group-grip { display:block; }
  .group-card.group-dragging { opacity:.4; }
  .group-card.reorder-above { box-shadow:0 -2px 0 0 var(--accent) inset; }
  .group-card.reorder-below { box-shadow:0 2px 0 0 var(--accent) inset; }

  /* Menú de ordenado de secciones */
  .sort-wrap { position:relative;flex-shrink:0; }
  .sort-menu {
    position:absolute;top:calc(100% + 6px);right:0;z-index:40;min-width:190px;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:5px;display:none;flex-direction:column;gap:2px;box-shadow:0 12px 30px rgba(0,0,0,.35);
  }
  .sort-menu.open { display:flex; }
  .sort-opt {
    display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;
    background:transparent;border:none;color:var(--text);font-family:inherit;font-size:13px;text-align:left;width:100%;
  }
  .sort-opt:hover { background:var(--bg3); }
  .sort-opt .sort-check { width:14px;flex-shrink:0;color:var(--accent);opacity:0; }
  .sort-opt.active .sort-check { opacity:1; }
  .sort-menu .sort-sep { height:1px;background:var(--border);margin:4px 6px; }
  .sort-menu .sort-head { font-size:10.5px;color:var(--text2);font-weight:700;padding:4px 10px 2px;letter-spacing:.04em;text-transform:uppercase; }

  /* Barra de expandir / colapsar */
  .tree-bar { display:flex;gap:7px;flex-shrink:0;margin-top:-2px; }
  .tree-btn {
    display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:9px;
    background:transparent;border:1px solid var(--border);color:var(--text2);
    font-family:inherit;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;
    transition:background .12s,color .12s;-webkit-app-region:no-drag;
  }
  .tree-btn:hover { background:var(--bg3);color:var(--text); }

  /* Esquema de subtareas dentro de una tarea guardada */
  .sub-toggle {
    width:18px;height:18px;flex-shrink:0;border:none;background:transparent;color:var(--text2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:5px;
    transition:transform .16s ease,color .12s,background .12s;
  }
  .sub-toggle:hover { color:var(--text);background:var(--bg3); }
  .sub-toggle.open { transform:rotate(90deg); }
  .sub-toggle.none { visibility:hidden; }
  .archived-item { display:flex;flex-direction:column;flex-shrink:0; }
  .archived-subs {
    display:flex;flex-direction:column;
    margin:1px 0 4px 30px;padding-left:12px;
    border-left:1.5px solid var(--border);
  }
  .archived-sub {
    display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:7px;font-size:12.5px;
  }
  .archived-sub:hover { background:var(--bg3); }
  .archived-sub .sub-bullet {
    width:5px;height:5px;border-radius:50%;background:var(--text2);opacity:.55;flex-shrink:0;
  }
  .archived-sub .sub-nombre { flex:1;min-width:0;overflow-wrap:anywhere; }
  .archived-sub .sub-tiempo { font-size:11.5px;color:var(--text2);font-variant-numeric:tabular-nums;flex-shrink:0; }
  .archived-subs-empty { font-size:11px;color:var(--text2);opacity:.7;padding:5px 9px; }
  .group-tree-btn {
    background:transparent;border:none;color:var(--text2);width:24px;height:24px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0;transition:all .12s;-webkit-app-region:no-drag;
  }
  .group-header:hover .group-tree-btn { opacity:1; }
  .group-tree-btn:hover { background:var(--bg3);color:var(--accent); }
  .group-rename-input {
    flex:1;background:var(--bg);border:1px solid var(--accent);border-radius:6px;
    color:var(--text);font-family:inherit;font-size:13.5px;font-weight:600;padding:2px 6px;outline:none;-webkit-app-region:no-drag;
  }

  .group-tasks { display:flex;flex-direction:column;padding:2px 8px 8px;min-height:8px; }
  .group-card.collapsed .group-tasks { display:none; }

  .archived-task-row {
    display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:9px;cursor:pointer;
    -webkit-app-region:no-drag;flex-shrink:0;
  }
  .archived-task-row:hover { background:var(--bg3); }
  /* La que está corriendo ahora mismo, marcada y con su latido. */
  .archived-task-row.en-marcha {
    background:color-mix(in srgb, var(--accent2) 16%, transparent);
    box-shadow:inset 2px 0 0 var(--accent);
  }
  .archived-task-row.en-marcha .archived-dot { animation:latido-tarea 2.2s ease-in-out infinite; }
  .archived-task-row.en-marcha .archived-task-name { font-weight:650; }
  @keyframes latido-tarea {
    0%,100% { box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); }
    50%     { box-shadow:0 0 0 5px color-mix(in srgb, var(--accent) 0%, transparent); }
  }
  .archived-play {
    background:transparent;border:none;width:26px;height:26px;border-radius:7px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:var(--success);transition:all .12s;-webkit-app-region:no-drag;
  }
  .archived-play:hover { background:var(--bg2); }
  .archived-play.is-playing { color:var(--danger);opacity:1; }
  .archived-del {
    background:transparent;border:none;width:26px;height:26px;border-radius:7px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:var(--text2);opacity:0;transition:all .12s;-webkit-app-region:no-drag;
  }
  .archived-task-row:hover .archived-del { opacity:1; }
  .archived-del:hover { background:rgba(248,113,113,.2);color:var(--danger); }
  .archived-edit {
    background:transparent;border:none;color:var(--text2);width:26px;height:26px;border-radius:7px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    opacity:0;transition:all .12s;-webkit-app-region:no-drag;
  }
  .archived-task-row:hover .archived-edit { opacity:1; }
  .archived-edit:hover { background:var(--bg3);color:var(--accent); }
  .archived-task-row.dragging { opacity:.4; }
  .archived-grip { color:var(--text2);opacity:.5;flex-shrink:0;cursor:grab; }
  .archived-dot {
    width:10px;height:10px;border-radius:50%;flex-shrink:0;cursor:pointer;
    transition:transform .14s, box-shadow .14s;
  }
  .archived-dot:hover { transform:scale(1.5);box-shadow:0 0 0 3px color-mix(in srgb, var(--text) 14%, transparent); }
  .archived-task-name { flex:1;font-size:13.5px;line-height:1.4;min-width:0;white-space:normal;overflow-wrap:anywhere; }
  .archived-task-time { font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums;flex-shrink:0; }

  .group-empty-hint { font-size:11.5px;color:var(--text2);text-align:center;padding:8px 6px;font-style:italic; }
  .empty-state { text-align:center;color:var(--text2);font-size:13px;padding:34px 12px;line-height:1.5; }

  /* Papelera: sección aparte al final de la lista, con las tareas borradas que aún se
     pueden restaurar. Tono rojizo para distinguirla de las secciones normales. */
  .trash-card { border:1px solid rgba(248,113,113,.28);border-radius:var(--radius-sm);background:rgba(248,113,113,.06);overflow:hidden;flex-shrink:0; }
  .trash-header { display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;-webkit-app-region:no-drag; }
  .trash-header:hover { background:rgba(248,113,113,.10); }
  .trash-title { flex:1;font-size:13.5px;font-weight:600;color:var(--danger); }
  .trash-tasks { display:flex;flex-direction:column;padding:2px 8px 8px;gap:2px; }
  .trash-card.collapsed .trash-tasks { display:none; }
  .trash-card.collapsed .group-chevron { transform:rotate(-90deg); }
  .trash-row { display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;-webkit-app-region:no-drag; }
  .trash-row:hover { background:color-mix(in srgb, var(--text) 7%, transparent); }
  .trash-dot { width:9px;height:9px;border-radius:50%;flex-shrink:0;opacity:.6; }
  .trash-name { flex:1;font-size:13px;min-width:0;white-space:normal;overflow-wrap:anywhere; }
  .trash-when { font-size:10.5px;color:var(--text2);flex-shrink:0; }
  .trash-btn { background:transparent;border:1px solid var(--border);color:var(--text2);font-size:11px;padding:4px 8px;border-radius:6px;flex-shrink:0;-webkit-app-region:no-drag; }
  .trash-btn.restore:hover { background:rgba(52,211,153,.18);color:var(--success);border-color:rgba(52,211,153,.3); }
  .trash-btn.forever:hover { background:rgba(248,113,113,.2);color:var(--danger);border-color:rgba(248,113,113,.3); }
  .trash-hint { font-size:11px;color:var(--text2);padding:2px 8px 8px;font-style:italic; }
</style>
</head>
<body>
<div class="app animate-in">
  <div class="win-drag" title="Arrastra para mover la ventana"></div>


  <div class="win-controls">
    <button class="win-btn close" onclick="closeWin()" title="Cerrar">
      <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="app-title" style="display:flex;align-items:center;gap:8px">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    Tareas
  </div>

  <div class="groups-topbar" style="display:flex;gap:8px;-webkit-app-region:no-drag">
    <input type="text" id="searchInput" placeholder="Buscar tarea o sección..." oninput="renderGroups()" style="flex:1">
    <button class="btn-ghost" onclick="openSectionPopup('create')" style="white-space:nowrap;display:flex;align-items:center;gap:6px" title="Crear una sección nueva">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v4M10 12h4"/></svg>
      Sección
    </button>
    <div class="sort-wrap">
      <button class="btn-ghost" id="sortBtn" onclick="toggleSortMenu(event)" title="Ordenar las secciones" style="white-space:nowrap;display:flex;align-items:center;gap:7px;padding:0 13px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h13M3 12h9M3 18h5"/></svg>
        <span id="sortBtnLabel">Ordenar</span>
        <svg id="sortDirIcon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
      </button>
      <div class="sort-menu" id="sortMenu">
        <button class="sort-opt" data-sort="alpha" onclick="chooseSort('alpha')">
          <svg class="sort-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          Alfabético (A → Z)
        </button>
        <button class="sort-opt" data-sort="created" onclick="chooseSort('created')">
          <svg class="sort-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          Orden de creación
        </button>
        <button class="sort-opt" data-sort="custom" onclick="chooseSort('custom')">
          <svg class="sort-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          Personalizado (arrastrar)
        </button>
        <div class="sort-sep"></div>
        <div class="sort-head">Sentido</div>
        <button class="sort-opt" data-dir="asc" onclick="chooseSortDir('asc')">
          <svg class="sort-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          Ascendente
        </button>
        <button class="sort-opt" data-dir="desc" onclick="chooseSortDir('desc')">
          <svg class="sort-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          Descendente
        </button>
      </div>
    </div>
    <button class="btn-primary" onclick="openStartPopup(null)" style="white-space:nowrap;display:flex;align-items:center;gap:6px">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Nueva
    </button>
  </div>

  <div class="tree-bar no-drag">
    <button class="tree-btn" onclick="expandirTodo()" title="Abrir todas las secciones y todas sus subtareas">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      Expandir todo
    </button>
    <button class="tree-btn" onclick="colapsarTodo()" title="Cerrar todas las secciones">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5"/></svg>
      Colapsar todo
    </button>
  </div>

  <div class="groups-list" id="groupsList"></div>

  <!-- Popup crear tarea / empezar tarea guardada -->
  <div class="popup-backdrop" id="startPopupBackdrop" style="display:none" onclick="closeStartPopup()"></div>
  <div class="entry-popup" id="startPopup" style="display:none">
    <div class="entry-popup-title" id="startPopupTitle">Nueva tarea</div>
    <div id="startPopupNameFields">
      <input type="text" id="startPopupName" placeholder="Nombre de la tarea..." maxlength="120">
    </div>
    <div id="startPopupColorSection" style="display:none">
      <div class="colors-label">Color</div>
      <div class="color-row" id="startPopupColorPicker"></div>
    </div>
    <div class="back-row" style="flex-wrap:wrap;row-gap:6px">
      <span class="back-label">¿Ya llevas tiempo? Empezó hace:</span>
      <input type="number" id="startBackMinutes" placeholder="0" min="0" max="600"
        style="width:64px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:inherit;font-size:13px;padding:6px 8px;outline:none;-webkit-app-region:no-drag">
      <span class="back-label">min</span>
      <span class="back-label">o desde:</span>
      <input type="time" id="startBackTime"
        style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:inherit;font-size:13px;padding:6px 8px;outline:none;-webkit-app-region:no-drag">
    </div>
    <div class="entry-popup-actions">
      <div style="flex:1"></div>
      <button class="btn-ghost" onclick="closeStartPopup()">Cancelar</button>
      <button class="btn-primary" onclick="confirmStart()">▶ Empezar</button>
    </div>
  </div>

  <!-- Popup renombrar tarea guardada -->
  <div class="popup-backdrop" id="taskRenameBackdrop" style="display:none" onclick="closeTaskRenamePopup()"></div>
  <div class="entry-popup" id="taskRenamePopup" style="display:none">
    <div class="entry-popup-title">Cambiar el nombre</div>
    <input type="text" id="taskRenameInput" placeholder="Nombre de la tarea..." maxlength="120"
      onkeydown="if(event.key==='Enter')confirmTaskRename()">
    <span style="font-size:11.5px;color:var(--text2);line-height:1.4">
      Cambia el nombre de aquí en adelante. Lo que ya está en el calendario conserva el nombre que tenía en cada momento.
    </span>
    <div class="entry-popup-actions">
      <div style="flex:1"></div>
      <button class="btn-ghost" onclick="closeTaskRenamePopup()">Cancelar</button>
      <button class="btn-primary" onclick="confirmTaskRename()">Guardar</button>
    </div>
  </div>

  <!-- Popup crear / renombrar sección -->
  <div class="popup-backdrop" id="colorPopupBackdrop" style="display:none" onclick="closeColorPopup()"></div>
  <div class="entry-popup" id="colorPopup" style="display:none">
    <div class="entry-popup-title" id="colorPopupTitle">Color de la tarea</div>
    <div class="color-row" id="colorPopupPicker"></div>
    <div class="entry-popup-actions">
      <div style="flex:1"></div>
      <button class="btn-ghost" onclick="closeColorPopup()">Cerrar</button>
    </div>
  </div>

  <div class="popup-backdrop" id="sectionPopupBackdrop" style="display:none" onclick="closeSectionPopup()"></div>
  <div class="entry-popup" id="sectionPopup" style="display:none">
    <div class="entry-popup-title" id="sectionPopupTitle">Nueva sección</div>
    <input type="text" id="sectionPopupName" placeholder="Nombre de la sección..." maxlength="60"
      onkeydown="if(event.key==='Enter')confirmSection()">
    <div class="entry-popup-actions">
      <div style="flex:1"></div>
      <button class="btn-ghost" onclick="closeSectionPopup()">Cancelar</button>
      <button class="btn-primary" onclick="confirmSection()">Guardar</button>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
const { ipcRenderer } = require('electron');
let currentState = null;
let startPopupTaskId = null; // null = crear tarea nueva
let startPopupSubId = null;  // subtarea con la que arrancar, si se pulsó una del esquema
let startPopupColor = COLORS[0];
let sectionPopupMode = null;  // 'create' | 'rename'
let sectionPopupGroupId = null;
let draggedTaskId = null;
const collapsedGroups = new Set();

function fmt(secs) {
  const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
  return h > 0 ? `${h}h ${String(m).padStart(2, '0')}m` : `${m}m`;
}

ipcRenderer.on('state', (_, state) => { currentState = state; renderGroups(); maybeStartTutorial(); });
ipcRenderer.send('action', { type: 'get-state' });

// Ver comentario en main.html: embebido, se espera a que el panel esté desplegado.
let tutorialActive = false;
function maybeStartTutorial() {
  if (tutorialActive || !currentState || !isViewVisibleToUser()) return;
  const seen = (currentState.settings && currentState.settings.tutorialSeenSteps) || [];
  tutorialActive = startTutorialIfNeeded('groups', seen, () => { tutorialActive = false; });
}
window.addEventListener('dock-expanded', maybeStartTutorial);
window.addEventListener('tutorial-tour', maybeStartTutorial);

// ── Color de una tarea guardada ──────────────────────────────────────────────
// El mismo selector que el del Panel: no hace falta desarchivar una tarea para poder
// cambiarle el color.
// Clave de la sección que agrupa lo que no está en ninguna sección de verdad.
const PANEL_SEC = '__sin__';
const SVG_PLAY = `<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M3 2l7 4-7 4V2z"/></svg>`;
const SVG_PAUSE = `<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="2" y="1" width="3" height="10" rx="1"/><rect x="7" y="1" width="3" height="10" rx="1"/></svg>`;

let colorPopupTaskId = null;

function openColorPopup(task) {
  colorPopupTaskId = task.id;
  document.getElementById('colorPopupTitle').textContent = task.name;
  const picker = document.getElementById('colorPopupPicker');
  picker.innerHTML = '';
  COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (task.color === c ? ' selected' : '');
    sw.style.background = c;
    sw.onclick = () => {
      ipcRenderer.send('action', { type:'edit-task-color', payload:{ taskId: colorPopupTaskId, color: c } });
      closeColorPopup();
    };
    picker.appendChild(sw);
  });
  document.getElementById('colorPopupBackdrop').style.display = 'block';
  document.getElementById('colorPopup').style.display = 'flex';
}

function closeColorPopup() {
  document.getElementById('colorPopupBackdrop').style.display = 'none';
  document.getElementById('colorPopup').style.display = 'none';
  colorPopupTaskId = null;
}

// ── Esquema: qué tareas guardadas tienen sus subtareas a la vista ────────────
const subsAbiertas = new Set();

function expandirTodo() {
  collapsedGroups.clear();
  (currentState ? currentState.tasks : []).forEach(t => {
    if (t.archived && !t.deleted && (t.subtasks || []).length) subsAbiertas.add(t.id);
  });
  trashCollapsed = false;
  renderGroups();
}

function colapsarTodo() {
  (currentState ? currentState.groups : []).forEach(g => collapsedGroups.add(g.id));
  subsAbiertas.clear();
  trashCollapsed = true;
  renderGroups();
}

// ── Ordenado de secciones ─────────────────────────────────────────────────────
let draggedGroupId = null;

function currentSortDir() {
  return (currentState && currentState.settings && currentState.settings.groupSortDir) || 'asc';
}

function chooseSortDir(dir) {
  document.getElementById('sortMenu').classList.remove('open');
  ipcRenderer.send('action', { type:'set-group-sort', payload:{ dir } });
}

function currentSort() {
  return (currentState && currentState.settings && currentState.settings.groupSort) || 'created';
}

function toggleSortMenu(e) {
  e.stopPropagation();
  document.getElementById('sortMenu').classList.toggle('open');
}
document.addEventListener('click', () => {
  const m = document.getElementById('sortMenu');
  if (m) m.classList.remove('open');
});

function chooseSort(sort) {
  document.getElementById('sortMenu').classList.remove('open');
  ipcRenderer.send('action', { type: 'set-group-sort', payload: { sort } });
}

// Si se suelta el asa sin llegar a arrastrar, la tarjeta deja de ser arrastrable.
document.addEventListener('mouseup', () => {
  if (draggedGroupId) return;
  document.querySelectorAll('.group-card[draggable="true"]').forEach(c => { c.draggable = false; });
});

function clearReorderMarks() {
  document.querySelectorAll('.reorder-above,.reorder-below')
    .forEach(c => c.classList.remove('reorder-above', 'reorder-below'));
}

// Recoloca la sección arrastrada justo antes o después de aquella sobre la que se suelta,
// y manda al proceso principal el orden resultante completo.
function dropGroupOn(targetId, above) {
  const movedId = draggedGroupId;
  draggedGroupId = null;
  const ids = (currentState.groups || []).map(g => g.id);
  const from = ids.indexOf(movedId);
  if (from === -1) return;
  ids.splice(from, 1);
  let to = ids.indexOf(targetId);
  if (to === -1) return;
  if (!above) to += 1;
  ids.splice(to, 0, movedId);
  ipcRenderer.send('action', { type: 'reorder-groups', payload: { ids } });
}

function renderGroups() {
  const list = document.getElementById('groupsList');
  // Marca en el menú el criterio y el sentido activos, y el botón dice cuál es.
  document.querySelectorAll('.sort-opt[data-sort]').forEach(o =>
    o.classList.toggle('active', o.dataset.sort === currentSort()));
  document.querySelectorAll('.sort-opt[data-dir]').forEach(o =>
    o.classList.toggle('active', o.dataset.dir === currentSortDir()));
  const etiquetas = { alpha: 'A → Z', created: 'Creación', custom: 'Manual' };
  const lbl = document.getElementById('sortBtnLabel');
  if (lbl) lbl.textContent = etiquetas[currentSort()] || 'Ordenar';
  const dirIcon = document.getElementById('sortDirIcon');
  if (dirIcon) dirIcon.style.transform = currentSortDir() === 'desc' ? '' : 'rotate(180deg)';
  list.innerHTML = '';
  if (!currentState) return;

  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const groups = currentState.groups || [];
  const archivedTasks = currentState.tasks.filter(t => t.archived && !t.deleted);
  // Esta pantalla ya no es solo el archivo: son TODAS las tareas. Las que no están en
  // ninguna sección (las del panel, y las archivadas cuya sección ya no existe) van en
  // un grupo propio al principio, para poder repartirlas desde aquí cuando se quiera.
  const sinSeccion = currentState.tasks.filter(t =>
    !t.deleted && !groups.some(g => g.id === t.groupId));

  // No es una sección de verdad: ni se renombra ni se borra. Soltar una tarea encima
  // la saca de Guardadas y la devuelve al panel.
  const secciones = [{ id: PANEL_SEC, name: 'Sin sección', tasks: sinSeccion, virtual: true }]
    .concat(groups.map(g => ({ id: g.id, name: g.name, tasks: archivedTasks.filter(t => t.groupId === g.id) })));

  let anyVisible = false;
  secciones.forEach(g => {
    const tasksInGroup = g.tasks;
    const filtered = query ? tasksInGroup.filter(t => t.name.toLowerCase().includes(query)) : tasksInGroup;
    // Al buscar, ocultamos las secciones sin coincidencias; sin búsqueda mostramos
    // todas (aunque estén vacías) para poder arrastrar tareas hacia ellas.
    if (query && !filtered.length) return;
    if (g.virtual && !tasksInGroup.length) return;   // sin tareas en el panel, no estorba
    anyVisible = true;

    const collapsed = !query && collapsedGroups.has(g.id);
    const card = document.createElement('div');
    card.className = 'group-card' + (collapsed ? ' collapsed' : '');
    card.dataset.groupId = g.id;

    const header = document.createElement('div');
    header.className = 'group-header';
    header.innerHTML = `
      <svg class="group-grip" width="10" height="14" viewBox="0 0 10 14" fill="currentColor"><circle cx="2.5" cy="2.5" r="1.3"/><circle cx="7.5" cy="2.5" r="1.3"/><circle cx="2.5" cy="7" r="1.3"/><circle cx="7.5" cy="7" r="1.3"/><circle cx="2.5" cy="11.5" r="1.3"/><circle cx="7.5" cy="11.5" r="1.3"/></svg>
      <svg class="group-chevron" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 1l4 4-4 4"/></svg>
      <span class="group-name">${g.name}</span>
      <span class="group-count">${tasksInGroup.length}</span>
      <button class="group-tree-btn" title="Abrir o cerrar las subtareas de esta sección">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      </button>
      ${g.virtual ? '' : `
      <button class="group-edit" title="Cambiar el nombre">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </button>
      <button class="group-del" title="Eliminar sección">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
      </button>`}`;
    header.onclick = () => {
      if (collapsedGroups.has(g.id)) collapsedGroups.delete(g.id); else collapsedGroups.add(g.id);
      renderGroups();
    };
    // Renombrar es cosa del lápiz: el doble clic era un gesto que no se veía por ningún lado.
    const btnEdit = header.querySelector('.group-edit');
    if (btnEdit) btnEdit.onclick = (e) => { e.stopPropagation(); openSectionPopup('rename', g.id, g.name); };
    const btnTree = header.querySelector('.group-tree-btn');
    if (btnTree) btnTree.onclick = (e) => {
      e.stopPropagation();
      // Si hay alguna abierta, el botón las cierra todas; si no, las abre todas.
      const conSubs = tasksInGroup.filter(t => (t.subtasks || []).length);
      const algunaAbierta = conSubs.some(t => subsAbiertas.has(t.id));
      conSubs.forEach(t => { if (algunaAbierta) subsAbiertas.delete(t.id); else subsAbiertas.add(t.id); });
      renderGroups();
    };
    const btnDel = header.querySelector('.group-del');
    if (btnDel) btnDel.onclick = (e) => {
      e.stopPropagation();
      if (confirm(`¿Eliminar la sección "${g.name}"?\nLas tareas que contenga volverán al panel principal (no se borran).`))
        ipcRenderer.send('action', { type: 'delete-group', payload: { groupId: g.id } });
    };
    card.appendChild(header);

    const tasksWrap = document.createElement('div');
    tasksWrap.className = 'group-tasks';
    if (!filtered.length) {
      const hint = document.createElement('div');
      hint.className = 'group-empty-hint';
      hint.textContent = 'Sección vacía · arrastra tareas aquí';
      tasksWrap.appendChild(hint);
    }
    filtered.forEach(t => {
      const nodo = document.createElement('div');
      nodo.className = 'archived-item';
      const nSubs = (t.subtasks || []).length;
      const abierta = subsAbiertas.has(t.id);

      const row = document.createElement('div');
      const enMarcha = t.id === currentState.activeTaskId;
      row.className = 'archived-task-row' + (enMarcha ? ' en-marcha' : '');
      row.draggable = true;
      row.dataset.taskId = t.id;
      row.title = enMarcha
        ? 'En marcha ahora mismo'
        : 'Click para empezarla · arrástrala para moverla de sección';
      row.innerHTML = `
        <svg class="archived-grip" width="10" height="14" viewBox="0 0 10 14" fill="currentColor"><circle cx="2.5" cy="2.5" r="1.3"/><circle cx="7.5" cy="2.5" r="1.3"/><circle cx="2.5" cy="7" r="1.3"/><circle cx="7.5" cy="7" r="1.3"/><circle cx="2.5" cy="11.5" r="1.3"/><circle cx="7.5" cy="11.5" r="1.3"/></svg>
        <button class="sub-toggle ${abierta ? 'open' : ''} ${nSubs ? '' : 'none'}" title="Ver las subtareas">
          <svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 1l4 4-4 4"/></svg>
        </button>
        <div class="archived-dot" style="background:${t.color}" title="Cambiar color"></div>
        <span class="archived-task-name">${t.name}</span>
        <span class="archived-task-time">${fmt(t.totalSecs)}</span>
        <button class="archived-edit" title="Cambiar el nombre">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </button>
        <button class="archived-play ${enMarcha ? 'is-playing' : 'is-stopped'}" title="${enMarcha ? 'Pausar' : 'Iniciar'}">
          ${enMarcha ? SVG_PAUSE : SVG_PLAY}
        </button>
        <button class="archived-del" title="Eliminar tarea">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
        </button>`;
      row.onclick = () => openStartPopup(t);
      row.querySelector('.archived-dot').onclick = (e) => { e.stopPropagation(); openColorPopup(t); };
      // Play directo: si está archivada la saca de Guardadas y la arranca; si ya está
      // en marcha, la pausa.
      // Eliminar manda a la papelera (30 días para arrepentirse) y NO toca el
      // calendario: los ratos ya hechos siguen ahí con el nombre que tenían.
      row.querySelector('.archived-del').onclick = (e) => {
        e.stopPropagation();
        const dias = (currentState.trashRetentionDays || 30);
        const aviso = `¿Eliminar "${t.name}"?

Irá a la papelera y podrás restaurarla durante ${dias} días.
El calendario NO se toca: todo el tiempo que ya has registrado con ella se sigue viendo igual.`;
        if (confirm(aviso)) ipcRenderer.send('action', { type: 'delete-task', payload: { taskId: t.id } });
      };
      row.querySelector('.archived-play').onclick = (e) => {
        e.stopPropagation();
        if (enMarcha) ipcRenderer.send('action', { type: 'pause' });
        else if (t.archived) ipcRenderer.send('action', { type: 'restore-and-start-task', payload: { taskId: t.id } });
        else ipcRenderer.send('action', { type: 'switch-task', payload: { taskId: t.id } });
      };
      row.querySelector('.archived-edit').onclick = (e) => { e.stopPropagation(); openTaskRenamePopup(t); };
      row.addEventListener('dragstart', (e) => {
        draggedTaskId = t.id;
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', t.id); } catch {}
      });
      row.addEventListener('dragend', () => { draggedTaskId = null; row.classList.remove('dragging'); document.querySelectorAll('.group-card.drop-target').forEach(c => c.classList.remove('drop-target')); });
      row.querySelector('.sub-toggle').onclick = (e) => {
        e.stopPropagation();
        if (subsAbiertas.has(t.id)) subsAbiertas.delete(t.id); else subsAbiertas.add(t.id);
        renderGroups();
      };
      nodo.appendChild(row);

      // El esquema: las subtareas cuelgan de su tarea con su tiempo acumulado.
      if (abierta) {
        const subs = document.createElement('div');
        subs.className = 'archived-subs';
        if (!nSubs) {
          subs.innerHTML = '<div class="archived-subs-empty">Sin subtareas</div>';
        } else {
          (t.subtasks || []).forEach(sub => {
            const fila = document.createElement('div');
            fila.className = 'archived-sub';
            fila.innerHTML = `
              <span class="sub-bullet"></span>
              <span class="sub-nombre">${sub.name}</span>
              <span class="sub-tiempo">${fmt(sub.totalSecs)}</span>`;
            fila.title = `Empezar "${t.name}" en "${sub.name}"`;
            fila.onclick = (e) => { e.stopPropagation(); openStartPopup(t, sub.id); };
            subs.appendChild(fila);
          });
        }
        nodo.appendChild(subs);
      }
      tasksWrap.appendChild(nodo);
    });
    card.appendChild(tasksWrap);

    // ── Orden personalizado: la sección se arrastra por su asa ────────────────
    // El orden personalizado no aplica a "Sin sección": no se arrastra a ningún sitio.
    if (currentSort() === 'custom' && !query && !g.virtual) {
      card.classList.add('sortable');
      const grip = header.querySelector('.group-grip');
      // El truco de siempre: la tarjeta solo se vuelve arrastrable mientras se
      // agarra el asa, para no robarle el arrastre a las tareas de dentro.
      grip.addEventListener('mousedown', (e) => { e.stopPropagation(); card.draggable = true; });
      grip.addEventListener('click', (e) => e.stopPropagation());
      card.addEventListener('dragstart', (e) => {
        if (draggedTaskId) return;            // se está moviendo una tarea, no la sección
        e.stopPropagation();
        draggedGroupId = g.id;
        card.classList.add('group-dragging');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', g.id); } catch {}
      });
      card.addEventListener('dragend', () => {
        draggedGroupId = null;
        card.draggable = false;
        card.classList.remove('group-dragging');
        clearReorderMarks();
      });
    }

    // La tarjeta entera es zona de soltado.
    card.addEventListener('dragover', (e) => {
      if (draggedGroupId && draggedGroupId !== g.id) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const r = card.getBoundingClientRect();
        const above = e.clientY < r.top + r.height / 2;
        clearReorderMarks();
        card.classList.add(above ? 'reorder-above' : 'reorder-below');
        return;
      }
      if (draggedTaskId) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
    });
    card.addEventListener('dragenter', (e) => { if (draggedTaskId) { e.preventDefault(); card.classList.add('drop-target'); } });
    card.addEventListener('dragleave', (e) => { if (!card.contains(e.relatedTarget)) card.classList.remove('drop-target'); });
    card.addEventListener('drop', (e) => {
      e.preventDefault();
      card.classList.remove('drop-target');
      if (draggedGroupId && draggedGroupId !== g.id) {
        const above = card.classList.contains('reorder-above');
        clearReorderMarks();
        dropGroupOn(g.id, above);
        return;
      }
      const taskId = draggedTaskId;
      draggedTaskId = null;
      if (!taskId) return;
      const task = currentState.tasks.find(t => t.id === taskId);
      if (!task) return;
      if (g.virtual) {
        // Fuera de toda sección: vuelve al panel principal.
        if (task.archived) ipcRenderer.send('action', { type: 'unarchive-task', payload: { taskId } });
      } else if (task.groupId !== g.id || !task.archived) {
        ipcRenderer.send('action', { type: 'move-task-to-group', payload: { taskId, groupId: g.id } });
      }
    });

    list.appendChild(card);
  });

  if (!anyVisible) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    // Sin búsqueda, "sin resultados" no dice nada: es que aún no hay tareas.
    empty.innerHTML = query
      ? 'Sin resultados para esa búsqueda.'
      : 'Todavía no tienes tareas.<br>Créalas con "+ Nueva", y agrúpalas en secciones cuando quieras.';
    list.appendChild(empty);
  }

  renderTrash(list);
}

let trashCollapsed = true;   // la papelera arranca plegada (no estorba el uso normal)

// Sección "Papelera" al final de la lista: tareas borradas que aún se pueden restaurar
// (dentro del plazo). No se filtra por la búsqueda de arriba, para no esconderla sin querer.
function renderTrash(list) {
  const trashed = (currentState.tasks || []).filter(t => t.inTrash);
  if (!trashed.length) return;
  // Más recientes primero.
  trashed.sort((a, b) => (b.deletedAt || 0) - (a.deletedAt || 0));
  const retention = currentState.trashRetentionDays || 30;

  const card = document.createElement('div');
  card.className = 'trash-card' + (trashCollapsed ? ' collapsed' : '');

  const header = document.createElement('div');
  header.className = 'trash-header';
  header.innerHTML = `
    <svg class="group-chevron" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 1l4 4-4 4"/></svg>
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
    <span class="trash-title">Papelera</span>
    <span class="group-count">${trashed.length}</span>`;
  header.onclick = () => { trashCollapsed = !trashCollapsed; renderGroups(); };
  card.appendChild(header);

  const wrap = document.createElement('div');
  wrap.className = 'trash-tasks';

  const hint = document.createElement('div');
  hint.className = 'trash-hint';
  hint.textContent = `Se restauran al panel principal. Pasados ${retention} días se quitan de aquí (pero podrás restaurarlas desde el calendario).`;
  wrap.appendChild(hint);

  trashed.forEach(t => {
    const daysLeft = Math.max(0, retention - Math.floor((Date.now() - (t.deletedAt || Date.now())) / 86400000));
    const row = document.createElement('div');
    row.className = 'trash-row';
    row.innerHTML = `
      <div class="trash-dot" style="background:${t.color}"></div>
      <span class="trash-name">${t.name}</span>
      <span class="trash-when">${daysLeft}d</span>`;
    const restore = document.createElement('button');
    restore.className = 'trash-btn restore';
    restore.textContent = 'Restaurar';
    restore.title = 'Devolver la tarea al panel principal';
    restore.onclick = () => ipcRenderer.send('action', { type: 'restore-task', payload: { taskId: t.id } });
    const forever = document.createElement('button');
    forever.className = 'trash-btn forever';
    forever.textContent = 'Eliminar';
    forever.title = 'Quitarla de la papelera (su historial seguirá en el calendario)';
    forever.onclick = () => {
      if (confirm(`¿Eliminar "${t.name}" de la papelera?\nSeguirá apareciendo en el calendario de los días en que la usaste, y desde ahí podrás restaurarla.`))
        ipcRenderer.send('action', { type: 'purge-task', payload: { taskId: t.id } });
    };
    row.appendChild(restore);
    row.appendChild(forever);
    wrap.appendChild(row);
  });

  card.appendChild(wrap);
  list.appendChild(card);
}

// ---------- Popup nueva tarea / empezar guardada ----------
function openStartPopup(task, subId) {
  const isNew = !task;
  startPopupTaskId = isNew ? null : task.id;
  startPopupSubId = subId || null;

  const sub = subId && (task.subtasks || []).find(x => x.id === subId);
  document.getElementById('startPopupTitle').textContent =
    isNew ? 'Nueva tarea' : (sub ? `${task.name} · ${sub.name}` : task.name);
  document.getElementById('startPopupNameFields').style.display = isNew ? 'block' : 'none';
  document.getElementById('startPopupName').value = '';

  const manualColors = currentState && currentState.settings && currentState.settings.colorMode === 'manual';
  document.getElementById('startPopupColorSection').style.display = (isNew && manualColors) ? '' : 'none';
  if (isNew) buildStartColorPicker();

  document.getElementById('startBackMinutes').value = '';
  document.getElementById('startBackTime').value = '';
  document.getElementById('startPopupBackdrop').style.display = 'block';
  document.getElementById('startPopup').style.display = 'flex';
}
function buildStartColorPicker() {
  const cp = document.getElementById('startPopupColorPicker');
  cp.innerHTML = '';
  startPopupColor = COLORS[0];
  COLORS.forEach((c, i) => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (i === 0 ? ' selected' : '');
    sw.style.background = c;
    sw.onclick = () => { cp.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected')); sw.classList.add('selected'); startPopupColor = c; };
    cp.appendChild(sw);
  });
}
function closeStartPopup() {
  document.getElementById('startPopupBackdrop').style.display = 'none';
  document.getElementById('startPopup').style.display = 'none';
  startPopupTaskId = null;
  startPopupSubId = null;
}
function confirmStart() {
  const backMinutes = computeBackMinutes('startBackMinutes', 'startBackTime');
  if (startPopupTaskId) {
    ipcRenderer.send('action', { type: 'restore-and-start-task', payload: { taskId: startPopupTaskId, backMinutes, subId: startPopupSubId || undefined } });
  } else {
    const name = document.getElementById('startPopupName').value.trim();
    if (!name) { alert('Ponle un nombre a la tarea'); return; }
    ipcRenderer.send('action', { type: 'create-task', payload: { name, color: startPopupColor, backMinutes } });
  }
  closeStartPopup();
}

// ---------- Renombrar una tarea guardada ----------
let renamingTaskId = null;
function openTaskRenamePopup(task) {
  renamingTaskId = task.id;
  const input = document.getElementById('taskRenameInput');
  input.value = task.name;
  document.getElementById('taskRenameBackdrop').style.display = 'block';
  document.getElementById('taskRenamePopup').style.display = 'flex';
  setTimeout(() => { input.focus(); input.select(); }, 0);
}
function closeTaskRenamePopup() {
  document.getElementById('taskRenameBackdrop').style.display = 'none';
  document.getElementById('taskRenamePopup').style.display = 'none';
  renamingTaskId = null;
}
function confirmTaskRename() {
  const name = document.getElementById('taskRenameInput').value.trim();
  if (!name) { alert('Ponle un nombre a la tarea'); return; }
  if (renamingTaskId) ipcRenderer.send('action', { type:'rename-task', payload:{ taskId: renamingTaskId, name } });
  closeTaskRenamePopup();
}

// ---------- Popup crear / renombrar sección ----------
function openSectionPopup(mode, groupId, currentName) {
  sectionPopupMode = mode;
  sectionPopupGroupId = groupId || null;
  document.getElementById('sectionPopupTitle').textContent = mode === 'rename' ? 'Renombrar sección' : 'Nueva sección';
  const input = document.getElementById('sectionPopupName');
  input.value = currentName || '';
  document.getElementById('sectionPopupBackdrop').style.display = 'block';
  document.getElementById('sectionPopup').style.display = 'flex';
  setTimeout(() => { input.focus(); input.select(); }, 0);
}
function closeSectionPopup() {
  document.getElementById('sectionPopupBackdrop').style.display = 'none';
  document.getElementById('sectionPopup').style.display = 'none';
  sectionPopupMode = null; sectionPopupGroupId = null;
}
function confirmSection() {
  const name = document.getElementById('sectionPopupName').value.trim();
  if (!name) { alert('Ponle un nombre a la sección'); return; }
  if (sectionPopupMode === 'rename' && sectionPopupGroupId) {
    ipcRenderer.send('action', { type: 'rename-group', payload: { groupId: sectionPopupGroupId, name } });
  } else {
    ipcRenderer.send('action', { type: 'create-group', payload: { name } });
  }
  closeSectionPopup();
}

function closeWin() { ipcRenderer.send('action', { type: 'close-groups' }); }
</script>
</body>
