<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Descansa la vista</title>
<style>
  /* Todo se mide en --u, una unidad que fija el JS a partir del ancho real de la
     ventana. Ni porcentajes en cadena, ni aspect-ratio, ni container queries: la
     primera versión apilaba las tres. Los ojos iban con flex:1 + aspect-ratio dentro
     de un contenedor sin altura, así que el stretch del flex ganaba a la proporción,
     los dejaba a cero de alto y todo el conjunto se aplanaba en una línea. */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    cursor: pointer; -webkit-user-select: none; user-select: none;
  }
  .burbuja {
    --u: 1.5px;
    --acento: #a5b4fc;
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: calc(var(--u) * 5);
    background: rgba(15, 15, 24, .9);
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: calc(var(--u) * 22);
    box-shadow: 0 calc(var(--u) * 9) calc(var(--u) * 30) rgba(0, 0, 0, .55);
    animation: entrar .5s cubic-bezier(.2, 1.25, .4, 1);
    transition: opacity .3s ease, transform .3s ease;
  }
  body.saliendo .burbuja { opacity: 0; transform: scale(.92); }
  @keyframes entrar {
    from { opacity: 0; transform: scale(.8) translateY(calc(var(--u) * -8)); }
    to   { opacity: 1; transform: none; }
  }

  /* ── Los ojos ───────────────────────────────────────────────────────────
     Dos óvalos con su pupila. Parpadean y miran despacio de un lado a otro:
     el movimiento ES la instrucción, apartar la vista de la pantalla. */
  .ojos { display: flex; gap: calc(var(--u) * 7); flex-shrink: 0; }
  .ojo {
    position: relative; flex-shrink: 0;
    width: calc(var(--u) * 26); height: calc(var(--u) * 19);
    background: #f6f6fb;
    border-radius: 50%;
    box-shadow: inset 0 calc(var(--u) * 1.5) calc(var(--u) * 3) rgba(0, 0, 0, .18);
    animation: parpadeo 6s ease-in-out infinite;
  }
  .ojo:nth-child(2) { animation-delay: .06s; }   /* parpadear a la vez clavada parece un robot */
  .pupila {
    position: absolute; top: 50%; left: 50%;
    width: calc(var(--u) * 10); height: calc(var(--u) * 10);
    margin: calc(var(--u) * -5) 0 0 calc(var(--u) * -5);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #4b4b66 0%, #16161f 65%);
    animation: mirar 6s ease-in-out infinite;
  }
  .brillo {
    position: absolute; top: calc(var(--u) * 1.6); right: calc(var(--u) * 1.8);
    width: calc(var(--u) * 3); height: calc(var(--u) * 3);
    border-radius: 50%; background: rgba(255, 255, 255, .9);
  }
  @keyframes parpadeo {
    0%, 44%, 52%, 100% { transform: scaleY(1); }
    48%                { transform: scaleY(.08); }
  }
  /* Mira a la izquierda, vuelve, mira a la derecha, vuelve. Despacio, sin tirones. */
  @keyframes mirar {
    0%,  12%   { transform: translate(0, 0); }
    25%, 37%   { transform: translate(calc(var(--u) * -6), 0); }
    50%, 57%   { transform: translate(0, 0); }
    70%, 82%   { transform: translate(calc(var(--u) * 6), 0); }
    95%, 100%  { transform: translate(0, 0); }
  }

  .cuenta {
    font-size: calc(var(--u) * 26);
    line-height: 1; font-weight: 800; color: var(--acento);
    font-variant-numeric: tabular-nums; flex-shrink: 0;
    text-shadow: 0 calc(var(--u) * 1.5) calc(var(--u) * 7) rgba(0, 0, 0, .5);
  }
  .texto {
    font-size: calc(var(--u) * 8);
    line-height: 1.25; font-weight: 600; text-align: center; flex-shrink: 0;
    color: rgba(255, 255, 255, .6);
    padding: 0 calc(var(--u) * 6);
  }
</style>
</head>
<body>
  <div class="burbuja" id="burbuja">
    <div class="ojos">
      <div class="ojo"><div class="pupila"><div class="brillo"></div></div></div>
      <div class="ojo"><div class="pupila"><div class="brillo"></div></div></div>
    </div>
    <div class="cuenta" id="cuenta">20</div>
    <div class="texto">Mira a lo lejos</div>
  </div>

<script>
const { ipcRenderer } = require('electron');

// La unidad base sale del ancho real de la ventana: 100px de ancho = --u de 1px, y
// todo lo demás va en múltiplos. Así el dibujo escala entero con el deslizador de
// tamaño de Ajustes sin depender de porcentajes que se puedan aplanar.
function ajustarEscala() {
  document.getElementById('burbuja').style.setProperty('--u', (window.innerWidth / 100) + 'px');
}
window.addEventListener('resize', ajustarEscala);
ajustarEscala();

ipcRenderer.on('theme', (_, t) => {
  if (t && t.accent) document.getElementById('burbuja').style.setProperty('--acento', t.accent);
});
ipcRenderer.send('action', { type: 'get-theme' });

let tic = null;

ipcRenderer.on('eye-start', (_, segundos) => {
  let restantes = Math.max(1, Number(segundos) || 20);
  ajustarEscala();
  document.body.classList.remove('saliendo');
  document.getElementById('cuenta').textContent = restantes;
  if (tic) clearInterval(tic);
  tic = setInterval(() => {
    restantes--;
    document.getElementById('cuenta').textContent = Math.max(0, restantes);
    if (restantes <= 0) { clearInterval(tic); tic = null; cerrar(); }
  }, 1000);
});

// Un clic la quita de en medio hasta el siguiente aviso: si estás en mitad de algo,
// que no haya que aguantarla los 20 segundos enteros.
function cerrar() {
  document.body.classList.add('saliendo');
  setTimeout(() => ipcRenderer.send('action', { type: 'eye-done' }), 300);
}
document.body.addEventListener('click', () => {
  if (tic) { clearInterval(tic); tic = null; }
  cerrar();
});
</script>
</body>
</html>
