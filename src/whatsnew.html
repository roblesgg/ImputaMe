<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  html, body { width:100%; height:100%; }
  body { border-radius:var(--radius); overflow:hidden; }
  .app {
    width:100%; height:100%; padding:24px 22px 20px;
    display:flex; flex-direction:column; gap:14px; position:relative;
  }

  .head { display:flex; flex-direction:column; gap:4px; flex-shrink:0; }
  .badge {
    align-self:flex-start; font-size:10.5px; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; color:var(--accent);
    background:color-mix(in srgb, var(--accent2) 20%, transparent);
    border:1px solid color-mix(in srgb, var(--accent) 32%, transparent);
    padding:4px 10px; border-radius:999px;
  }
  .title { font-size:21px; font-weight:700; letter-spacing:-.02em; }

  /* Cada novedad es un paso del recorrido: entra deslizándose. */
  .stage { flex:1; min-height:0; display:flex; align-items:center; }
  .step { display:flex; flex-direction:column; gap:10px; width:100%; animation:stepIn .3s cubic-bezier(.32,.72,0,1); }
  @keyframes stepIn { from { opacity:0; transform:translateX(16px); } to { opacity:1; transform:none; } }
  .step-icon {
    width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    background:color-mix(in srgb, var(--accent2) 22%, transparent);
    border:1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    color:var(--accent); flex-shrink:0;
  }
  .step-title { font-size:15.5px; font-weight:700; }
  .step-text { font-size:13px; color:var(--text2); line-height:1.55; }

  .foot { display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .dots { display:flex; gap:6px; flex:1; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--bg3); transition:all .25s; }
  .dot.on { background:var(--accent); width:20px; border-radius:4px; }
  .foot button { padding:10px 18px; font-size:13px; font-weight:600; }
</style>
</head>
<body>
<div class="app animate-in">
  <div class="win-drag" title="Arrastra para mover la ventana"></div>
  <div class="win-controls">
    <button class="win-btn close" onclick="closeWin()" title="Cerrar">
      <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="head">
    <span class="badge" id="badge">Novedades</span>
    <span class="title" id="title">imputa.me se ha actualizado</span>
  </div>

  <div class="stage"><div id="stage"></div></div>

  <div class="foot">
    <div class="dots" id="dots"></div>
    <button class="btn-ghost" id="prevBtn" onclick="go(-1)">Atrás</button>
    <button class="btn-primary" id="nextBtn" onclick="go(1)">Siguiente</button>
  </div>
</div>

<script src="shared.js"></script>
<script>
const { ipcRenderer } = require('electron');

const ICONS = {
  spark: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3"/></svg>`,
  cursor: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3l7 17 2.5-6.5L20 11z"/></svg>`,
  calendar: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`,
  bell: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>`,
  screen: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>`,
};

let steps = [];
let i = 0;

function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render() {
  const s = steps[i];
  if (!s) return;
  document.getElementById('stage').innerHTML = `
    <div class="step">
      <div class="step-icon">${ICONS[s.icon] || ICONS.spark}</div>
      <div class="step-title">${esc(s.title)}</div>
      <div class="step-text">${esc(s.text)}</div>
    </div>`;
  document.getElementById('dots').innerHTML =
    steps.map((_, n) => `<span class="dot${n === i ? ' on' : ''}"></span>`).join('');
  document.getElementById('prevBtn').style.visibility = i === 0 ? 'hidden' : 'visible';
  document.getElementById('nextBtn').textContent = i === steps.length - 1 ? 'Entendido' : 'Siguiente';
}

function go(d) {
  if (i + d < 0) return;
  if (i + d >= steps.length) { closeWin(); return; }
  i += d;
  render();
}

function closeWin() { ipcRenderer.send('action', { type:'close-whats-new' }); }

ipcRenderer.on('whats-new', (_, data) => {
  steps = (data && data.steps) || [];
  i = 0;
  document.getElementById('badge').textContent = 'Novedades · ' + (data && data.version || '');
  if (data && data.title) document.getElementById('title').textContent = data.title;
  render();
});
ipcRenderer.send('action', { type:'get-whats-new' });
</script>
</body>
</html>
