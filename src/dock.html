<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  /* Ventana de la BARRITA: cubre toda el área de trabajo, es transparente y deja pasar
     los clics salvo donde hay algo interactivo. Tiene que ser transparente de verdad, y
     por eso no puede llevar acrílico. El panel vive en su propia ventana (dock-panel),
     que sí lo lleva y por eso desenfoca de verdad lo que hay detrás. */
  html, body { width:100%; height:100%; background:transparent !important; overflow:hidden; margin:0; }
  body { -webkit-app-region:no-drag; }

  :root {
    --bar-w:7px; --bar-len:110px; --bar-pos:50%; --bar-offset:4px; --bar-color:#fff; --bar-opacity:.3;
    --panel:#1c1c2a;
  }

  .dock-root { position:absolute; inset:0; }

  /* ── Barrita ─────────────────────────────────────────────── */
  /* --bar-opacity es cómo se ve EN REPOSO; al acercar el ratón se muestra al máximo. */
  .dock-bar {
    position:absolute; cursor:pointer; border-radius:999px;
    background:var(--bar-color);
    opacity:var(--bar-opacity);
    box-shadow:0 2px 10px rgba(0,0,0,.35);
    will-change:transform, opacity;
    transition:opacity .22s ease, transform .22s cubic-bezier(.34,1.4,.5,1);
  }
  .dock-bar.near { opacity:1; }
  .a-right .dock-bar, .a-left .dock-bar {
    width:var(--bar-w); height:var(--bar-len); top:var(--bar-pos); transform:translateY(-50%);
  }
  .a-right .dock-bar { right:var(--bar-offset); }
  .a-left  .dock-bar { left:var(--bar-offset); }
  .a-right .dock-bar.near, .a-left .dock-bar.near { transform:translateY(-50%) scaleX(1.6); }

  .a-top .dock-bar, .a-bottom .dock-bar {
    height:var(--bar-w); width:var(--bar-len); left:var(--bar-pos); transform:translateX(-50%);
  }
  .a-top    .dock-bar { top:var(--bar-offset); }
  .a-bottom .dock-bar { bottom:var(--bar-offset); }
  .a-top .dock-bar.near, .a-bottom .dock-bar.near { transform:translateX(-50%) scaleY(1.6); }

  .expanded .dock-bar { opacity:0; pointer-events:none; }
  /* ...salvo mientras se ajusta desde Ajustes: ahí hay que verla para saber cómo queda. */
  .dock-root.expanded.preview-bar .dock-bar { opacity:var(--bar-opacity); pointer-events:auto; }
  .preview-bar .dock-bar { box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent), 0 2px 10px rgba(0,0,0,.35); }

  /* Mantener pulsado un momento "arma" el arrastre: la barrita se ilumina para avisar. */
  .dock-bar.arming { animation:barArming .65s cubic-bezier(.4,0,.6,1) forwards; }
  @keyframes barArming {
    0%   { opacity:var(--bar-opacity); filter:none; }
    100% { opacity:1; filter:brightness(1.5) drop-shadow(0 0 10px var(--bar-color)); }
  }
  .dock-bar.dragging {
    transition:none; opacity:1 !important; z-index:20; cursor:grabbing;
    box-shadow:0 6px 26px rgba(0,0,0,.5);
  }
  .dock-bar.snapping {
    transition:left .44s cubic-bezier(.2,.9,.25,1), top .44s cubic-bezier(.2,.9,.25,1),
               width .44s cubic-bezier(.2,.9,.25,1), height .44s cubic-bezier(.2,.9,.25,1),
               border-radius .44s ease, transform .44s cubic-bezier(.2,.9,.25,1);
    opacity:1 !important; z-index:20;
  }
  .dock-bar.morph { animation:liquidMorph .5s cubic-bezier(.3,1.3,.4,1); }
  @keyframes liquidMorph {
    0%   { transform:translate(-50%,-50%) scale(1.2, .8); }
    40%  { transform:translate(-50%,-50%) scale(.7, 1.35); }
    70%  { transform:translate(-50%,-50%) scale(1.12, .92); }
    100% { transform:translate(-50%,-50%) scale(1, 1); }
  }


  /* ── Botón de esconder el panel ─────────────────────────────────────────── */
  .hide-btn {
    position:fixed; left:0; top:0; width:34px; height:34px; padding:0;
    margin:-17px 0 0 -17px;            /* las coordenadas que llegan son las del CENTRO */
    border-radius:50%;
    display:none; align-items:center; justify-content:center;
    background:var(--surface); color:var(--text2);
    border:1px solid color-mix(in srgb, var(--text) 22%, transparent);
    box-shadow:0 4px 18px rgba(0,0,0,.5);
    cursor:pointer; z-index:20;
    transition:background .18s, color .18s, transform .22s cubic-bezier(.34,1.5,.5,1), box-shadow .18s, opacity .16s;
  }
  .hide-btn.visible { display:flex; }
  .hide-btn svg { transition:transform .22s cubic-bezier(.34,1.5,.5,1); }
  .hide-btn:hover {
    background:var(--accent2); color:#fff;
    box-shadow:0 6px 22px color-mix(in srgb, var(--accent2) 60%, transparent);
  }
  .hide-btn:active { transform:scale(.94); }
  /* La flecha apunta hacia el lado por el que se va el panel al esconderse. */
  .a-left  ~ .hide-btn svg { transform:scaleX(-1); }
  .a-top   ~ .hide-btn svg { transform:rotate(-90deg); }
  .a-bottom ~ .hide-btn svg { transform:rotate(90deg); }
</style>
</head>
<body>
<div class="dock-root a-right" id="dockRoot">
  <div class="dock-bar" id="dockBar" title="imputa.me — clic para desplegar"></div>
</div>

<!-- Botón de esconder el panel. Vivía en una ventana propia siempre-encima y no
     enfocable, y ese montaje dio tres fallos seguidos: la sombra recortada en cuadrado,
     la posición calculada con unos límites del panel que aún no eran los definitivos, y
     la pelea de orden entre las tres ventanas del dock, que lo dejaba sin recibir los
     clics. Aquí dentro no hay nada de eso: es la misma ventana de la barra, cuyo
     sistema de zonas clicables ya funciona. -->
<button class="hide-btn" id="hideBtn" title="Esconder">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
</button>

<script src="shared.js"></script>
<script>
const { ipcRenderer } = require('electron');
const root = document.getElementById('dockRoot');
const bar = document.getElementById('dockBar');
const hideBtn = document.getElementById('hideBtn');

const ANCHORS = ['left','right','top','bottom'];
const HOLD_MS = 650;      // cuánto hay que mantener pulsado para poder moverla
const CLICK_SLOP = 6;

let cfg = { anchor:'right', barWidth:7, barLength:110, barPos:50, barOffset:4, barColor:'#fff', barOpacity:30, panelWidth:460, panelHeight:620 };
let expanded = false;
let barDrag = null;

// Tamaño REAL del panel ahora mismo (el calendario es mucho más ancho): sin esto el
// botón de esconder se colocaba según el ancho "normal" y quedaba detrás del panel.
ipcRenderer.on('dock-config', (_, c) => {
  cfg = c;
  const s = document.documentElement.style;
  s.setProperty('--bar-w', c.barWidth + 'px');
  s.setProperty('--bar-len', c.barLength + 'px');
  s.setProperty('--bar-pos', c.barPos + '%');
  s.setProperty('--bar-offset', c.barOffset + 'px');
  s.setProperty('--bar-color', c.barColor);
  s.setProperty('--bar-opacity', (c.barOpacity / 100).toFixed(2));
  ANCHORS.forEach(a => root.classList.remove('a-' + a));
  root.classList.add('a-' + (ANCHORS.includes(c.anchor) ? c.anchor : 'right'));
  sendHitRects();
});

function isVertical() { return cfg.anchor === 'left' || cfg.anchor === 'right'; }

// ---- Zonas "clicables" ----
// El proceso principal decide si la ventana captura el ratón mirando dónde está el
// cursor de verdad; aquí solo se le mandan los rectángulos.
let lastRectsJson = '';
function sendHitRects() {
  const rects = [];
  const push = (el) => {
    const r = el.getBoundingClientRect();
    if (r.width > 0 && r.height > 0) rects.push({ x:Math.round(r.left), y:Math.round(r.top), w:Math.round(r.width), h:Math.round(r.height) });
  };
  if (barDrag && barDrag.dragging) {
    rects.push({ x:0, y:0, w:window.innerWidth, h:window.innerHeight });   // arrastrando: todo
  } else {
    push(bar);
    if (hideBtn.classList.contains('visible')) push(hideBtn);
  }
  const br = bar.getBoundingClientRect();
  const barRect = { x:Math.round(br.left), y:Math.round(br.top), w:Math.round(br.width), h:Math.round(br.height) };
  const json = JSON.stringify([rects, barRect]);
  if (json === lastRectsJson) return;
  lastRectsJson = json;
  ipcRenderer.send('action', { type:'dock-hit-rects', payload:{ rects, barRect } });
}
setInterval(sendHitRects, 180);

// Revelado de la barrita al acercar el ratón: lo decide el proceso principal, que sigue
// el cursor. Aquí ya no se puede con mousemove, porque la ventana dejó de pedir que se le
// reenviaran los movimientos (ese reenvío era lo que hacía parpadear el cursor).
// Clic derecho sobre la barra: el menú lo monta el proceso principal (nativo, para
// que se pinte por encima de todo y se coloque solo).
bar.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (barDrag) return;
  ipcRenderer.send('action', { type: 'dock-context-menu' });
});

// El proceso principal manda dónde va el botón (centro, en coordenadas de esta
// ventana) y si toca enseñarlo.
ipcRenderer.on('dock-hide-btn', (_, info) => {
  if (!info || !info.visible) { hideBtn.classList.remove('visible'); sendHitRects(); return; }
  hideBtn.style.left = info.x + 'px';
  hideBtn.style.top = info.y + 'px';
  hideBtn.classList.add('visible');
  sendHitRects();
});
hideBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  ipcRenderer.send('action', { type: 'dock-collapse-panel' });
});

ipcRenderer.on('dock-bar-near', (_, near) => {
  if (barDrag && barDrag.dragging) return;
  bar.classList.toggle('near', !!near && !expanded);
});

function expand() {
  if (expanded) return;
  expanded = true;
  root.classList.add('expanded');
  bar.classList.remove('near');
  sendHitRects();
  ipcRenderer.send('action', { type:'dock-expand' });
}
function collapse() {
  if (!expanded) return;
  expanded = false;
  root.classList.remove('expanded');
  sendHitRects();
  ipcRenderer.send('action', { type:'dock-collapse-panel' });
}
ipcRenderer.on('dock-collapse', () => collapse());
ipcRenderer.on('dock-toggle', () => { expanded ? collapse() : expand(); });
ipcRenderer.on('dock-expand', () => expand());

// Mientras se ajusta la barrita desde Ajustes se enseña aunque el panel esté abierto.
let barPreviewTimer = null;
ipcRenderer.on('dock-bar-preview', () => {
  root.classList.add('preview-bar');
  clearTimeout(barPreviewTimer);
  barPreviewTimer = setTimeout(() => root.classList.remove('preview-bar'), 1500);
});

// ---- Clic para desplegar, pulsación mantenida para moverla de sitio ----
bar.addEventListener('mousedown', (e) => {
  if (e.button !== 0 || expanded) return;
  e.preventDefault();
  const r = bar.getBoundingClientRect();
  barDrag = {
    startX: e.clientX, startY: e.clientY, moved: false, dragging: false,
    grabDX: e.clientX - (r.left + r.width / 2),
    grabDY: e.clientY - (r.top + r.height / 2),
    holdTimer: setTimeout(() => startBarDrag(e.clientX, e.clientY), HOLD_MS),
  };
  bar.classList.add('arming');
});

function startBarDrag(x, y) {
  if (!barDrag) return;
  barDrag.dragging = true;
  bar.classList.remove('arming');
  bar.classList.add('dragging');
  const r = bar.getBoundingClientRect();
  bar.style.width = r.width + 'px';
  bar.style.height = r.height + 'px';
  bar.style.right = 'auto'; bar.style.bottom = 'auto';
  bar.style.transform = 'translate(-50%,-50%)';
  moveBarTo(x, y);
  sendHitRects();
}
function moveBarTo(x, y) {
  bar.style.left = (x - barDrag.grabDX) + 'px';
  bar.style.top = (y - barDrag.grabDY) + 'px';
}

document.addEventListener('mousemove', (e) => {
  if (!barDrag) return;
  if (e.buttons === 0) { finishBarDrag(e.clientX, e.clientY); return; }   // se soltó fuera
  if (barDrag.dragging) { moveBarTo(e.clientX, e.clientY); return; }
  if (Math.hypot(e.clientX - barDrag.startX, e.clientY - barDrag.startY) > CLICK_SLOP) {
    barDrag.moved = true;
    clearTimeout(barDrag.holdTimer);
    bar.classList.remove('arming');
  }
});

function finishBarDrag(x, y) {
  if (!barDrag) return;
  const d = barDrag;
  clearTimeout(d.holdTimer);
  bar.classList.remove('arming');
  barDrag = null;
  if (d.dragging) { snapBarToEdge(x, y); return; }
  if (!d.moved) expand();
}
document.addEventListener('mouseup', (e) => finishBarDrag(e.clientX, e.clientY));
window.addEventListener('blur', () => { if (barDrag) finishBarDrag(barDrag.startX, barDrag.startY); });

// Encaja la barrita en el borde más cercano, respetando la separación configurada.
function snapBarToEdge(x, y) {
  const W = window.innerWidth, H = window.innerHeight;
  const dist = { left: x, right: W - x, top: y, bottom: H - y };
  const anchor = Object.keys(dist).reduce((a, b) => (dist[a] <= dist[b] ? a : b));

  const wasVertical = isVertical();
  const willBeVertical = anchor === 'left' || anchor === 'right';
  const off = cfg.barOffset || 0, len = cfg.barLength || 110, thick = cfg.barWidth || 7;
  const half = len / 2;

  let pos, left, top, w, h;
  if (willBeVertical) {
    const cy = Math.min(Math.max(y, half), H - half);
    pos = (cy / H) * 100;
    left = anchor === 'left' ? off + thick / 2 : W - off - thick / 2;
    top = cy; w = thick; h = len;
  } else {
    const cx = Math.min(Math.max(x, half), W - half);
    pos = (cx / W) * 100;
    top = anchor === 'top' ? off + thick / 2 : H - off - thick / 2;
    left = cx; w = len; h = thick;
  }

  cfg.anchor = anchor; cfg.barPos = pos;

  bar.classList.remove('dragging');
  bar.classList.add('snapping');
  if (wasVertical !== willBeVertical) bar.classList.add('morph');
  requestAnimationFrame(() => {
    bar.style.left = left + 'px'; bar.style.top = top + 'px';
    bar.style.width = w + 'px';  bar.style.height = h + 'px';
  });

  let done = false;
  const finish = () => {
    if (done) return; done = true;
    bar.classList.remove('snapping', 'morph');
    ['left','top','right','bottom','width','height','transform'].forEach(k => bar.style.removeProperty(k));
    ANCHORS.forEach(a => root.classList.remove('a-' + a));
    root.classList.add('a-' + anchor);
    document.documentElement.style.setProperty('--bar-pos', pos + '%');
    sendHitRects();
    ipcRenderer.send('action', { type:'set-dock-config', payload:{ dockAnchor: anchor, dockBarPos: Math.round(pos) } });
  };
  bar.addEventListener('transitionend', finish, { once: true });
  setTimeout(finish, 600);
}
</script>
</body>
</html>
