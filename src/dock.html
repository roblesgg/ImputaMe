<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  /* Ventana de tamaño FIJO y transparente de verdad (sin acrílico). El plegar/desplegar
     es solo CSS (fluido); la parte transparente deja pasar los clics al escritorio
     mediante setIgnoreMouseEvents, que el script activa/desactiva según dónde esté el
     ratón. Así no hay "recuadro gris" ni tirones por redimensionar la ventana. */
  html, body { width:100%; height:100%; background:transparent !important; overflow:hidden; margin:0; }
  body { -webkit-app-region:no-drag; }

  .dock-root { width:100%; height:100%; display:flex; }

  /* Panel: ocupa todo menos la barra; se desliza desde la derecha. Fondo propio (no
     acrílico de ventana) con un blur CSS para el efecto cristal. */
  .dock-panel {
    flex:1; height:100%; min-width:0;
    display:flex; flex-direction:column;
    background:rgba(22,22,32,.92);
    backdrop-filter:blur(28px) saturate(160%);
    -webkit-backdrop-filter:blur(28px) saturate(160%);
    border-radius:16px 0 0 16px;
    border:1px solid var(--border); border-right:none;
    box-shadow:-8px 0 30px rgba(0,0,0,.45);
    overflow:hidden;
    transform:translateX(105%);
    transition:transform .28s cubic-bezier(.32,.72,0,1);
  }
  .dock-root.expanded .dock-panel { transform:translateX(0); }

  /* Barra (grip) siempre visible pegada al borde derecho. */
  .dock-bar {
    width:14px; flex-shrink:0; height:100%;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:linear-gradient(180deg, rgba(99,102,241,.92), rgba(129,140,248,.92));
    border-radius:8px 0 0 8px;
    box-shadow:-3px 0 14px rgba(0,0,0,.4);
    transition:width .14s ease, background .18s ease, box-shadow .18s ease;
  }
  .dock-bar:hover { width:16px; }
  .dock-bar::after { content:''; width:4px; height:38px; border-radius:3px; background:rgba(255,255,255,.7); transition:height .18s ease; }
  .dock-root.expanded .dock-bar { background:rgba(255,255,255,.08); box-shadow:none; border-radius:0; }
  .dock-root.expanded .dock-bar::after { height:52px; background:rgba(255,255,255,.3); }

  /* Nav superior */
  .dock-nav { flex-shrink:0; display:flex; align-items:center; gap:2px; padding:9px 8px; border-bottom:1px solid var(--border); }
  .dock-nav-btn {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:transparent; border:none; color:var(--text2); cursor:pointer;
    padding:8px 3px; border-radius:10px; font-size:10.5px; transition:all .13s;
  }
  .dock-nav-btn svg { width:18px; height:18px; }
  .dock-nav-btn:hover { background:var(--bg3); color:var(--text); }
  .dock-nav-btn.active { background:rgba(99,102,241,.18); color:var(--accent); }
  .dock-collapse { background:transparent; border:none; color:var(--text2); cursor:pointer; width:30px; height:30px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .dock-collapse:hover { background:var(--bg3); color:var(--text); }

  .dock-content { flex:1; min-height:0; position:relative; }
  .dock-content iframe { position:absolute; inset:0; width:100%; height:100%; border:none; background:transparent; opacity:1; transition:opacity .16s ease; }
  .dock-content.switching iframe { opacity:0; }
</style>
</head>
<body>
<div class="dock-root" id="dockRoot">
  <div class="dock-panel">
    <div class="dock-nav">
      <button class="dock-nav-btn active" data-view="panel" onclick="navTo('panel')" title="Panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 0 0 1 1h3m10-11l2 2m-2-2v10a1 1 0 0 1-1 1h-3m-6 0a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1m-6 0h6"/></svg>
        Panel
      </button>
      <button class="dock-nav-btn" data-view="calendar" onclick="navTo('calendar')" title="Calendario">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Calendario
      </button>
      <button class="dock-nav-btn" data-view="groups" onclick="navTo('groups')" title="Guardadas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Guardadas
      </button>
      <button class="dock-nav-btn" data-view="settings" onclick="navTo('settings')" title="Ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Ajustes
      </button>
      <button class="dock-collapse" onclick="collapse()" title="Esconder">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="dock-content" id="dockContent">
      <iframe id="dockFrame" src="main.html?embed=1"></iframe>
    </div>
  </div>
  <div class="dock-bar" id="dockBar" title="imputa.me — clic para desplegar/esconder"></div>
</div>

<script>
const { ipcRenderer } = require('electron');
const root = document.getElementById('dockRoot');
const frame = document.getElementById('dockFrame');
const content = document.getElementById('dockContent');
const bar = document.getElementById('dockBar');

const VIEW_SRC = { panel:'main.html?embed=1', calendar:'calendar.html?embed=1', groups:'groups.html?embed=1', settings:'settings.html?embed=1' };
let currentView = 'panel';
let expanded = false;

// ---- Click-through: deja pasar los clics al escritorio salvo cuando el ratón está
// sobre algo interactivo (la barra si está plegado, o todo el panel si está desplegado).
let lastIgnore = null;
function setIgnore(ig) {
  if (ig === lastIgnore) return;
  lastIgnore = ig;
  ipcRenderer.send('action', { type:'dock-set-ignore-mouse', payload:{ ignore: ig } });
}
document.addEventListener('mousemove', (e) => {
  if (expanded) { setIgnore(false); return; }
  const el = document.elementFromPoint(e.clientX, e.clientY);
  setIgnore(!(el && el.closest('.dock-bar')));
});
setIgnore(true);   // arranca plegado: solo la barra captura

function setActiveNav(view) {
  document.querySelectorAll('.dock-nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
}

function expand() {
  if (expanded) return;
  expanded = true;
  root.classList.add('expanded');
  setIgnore(false);
  ipcRenderer.send('action', { type:'dock-focus' });
}
function collapse() {
  if (!expanded) return;
  expanded = false;
  root.classList.remove('expanded');
  setIgnore(true);   // el mousemove lo corrige a false si el ratón sigue sobre la barra
}
bar.addEventListener('click', () => { expanded ? collapse() : expand(); });

function navTo(view) {
  if (!VIEW_SRC[view]) return;
  if (!expanded) expand();
  if (view === currentView) return;
  currentView = view;
  setActiveNav(view);
  content.classList.add('switching');
  setTimeout(() => {
    frame.src = VIEW_SRC[view];
    frame.addEventListener('load', () => content.classList.remove('switching'), { once: true });
  }, 130);
}

ipcRenderer.on('dock-navigate', (_, view) => navTo(view));
ipcRenderer.on('dock-collapse', () => collapse());
ipcRenderer.on('dock-toggle', () => { expanded ? collapse() : expand(); });
</script>
</body>
</html>
