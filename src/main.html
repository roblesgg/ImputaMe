<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  html, body { width:100%;height:100%; }
  body { border-radius: var(--radius); overflow: hidden; }

  /* Contenedor no-drag; el arrastre va solo en el bloque del título (izquierda) para
     que la X (arriba a la derecha) se pulse entera. */
  .app { width:100%;height:100%;display:flex;flex-direction:column;padding:24px;gap:16px;position:relative;min-height:0;-webkit-app-region:no-drag; }
  .th-drag { -webkit-app-region:drag; }

  .titlebar { display:flex;align-items:center;justify-content:space-between; }
  .app-title { font-size:18px;font-weight:700;letter-spacing:-.02em; }
  .brand-dot { color:var(--accent); }
  .app-subtitle { font-size:12px;color:var(--text2);margin-top:2px; }

  /* El total del día baja a una línea fina: el protagonista es la tarea en marcha. */
  .total-banner {
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-shrink:0;
  }
  .total-inline { display:flex;align-items:baseline;gap:7px;white-space:nowrap; }
  .total-label { font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em; }
  .total-time { font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent); }

  /* ── Tarjeta de la tarea en marcha ──────────────────────────────────────── */
  .hero {
    background:linear-gradient(135deg, color-mix(in srgb, var(--accent2) 26%, transparent), color-mix(in srgb, var(--accent) 12%, transparent));
    border:1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius:16px;padding:18px;flex-shrink:0;
    display:flex;flex-direction:column;align-items:center;gap:11px;
    -webkit-app-region:no-drag;
  }
  .hero.idle {
    background:var(--bg2);border-color:var(--border);
    padding:22px 18px;gap:6px;
  }
  .hero-head { display:flex;align-items:center;gap:9px;max-width:100%; }
  .hero-dot {
    width:11px;height:11px;border-radius:50%;flex-shrink:0;cursor:pointer;
    box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent);
    animation:latido 2.2s ease-in-out infinite;
  }
  @keyframes latido {
    0%,100% { box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
    50%     { box-shadow:0 0 0 8px color-mix(in srgb, var(--accent) 6%, transparent); }
  }
  .hero-name {
    font-size:15px;font-weight:650;line-height:1.3;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .hero-time {
    font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);
    line-height:1;letter-spacing:-.01em;
  }
  .hero-idle-title { font-size:14px;font-weight:600;color:var(--text2); }
  .hero-idle-text { font-size:12px;color:var(--text2);opacity:.75;text-align:center;line-height:1.45; }
  .hero-actions { display:flex;align-items:center;gap:8px;margin-top:1px; }
  .hero-btn {
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    background:var(--accent2);color:#fff;border:none;border-radius:10px;
    font-family:inherit;font-size:13px;font-weight:650;padding:9px 18px;cursor:pointer;
    box-shadow:0 4px 14px color-mix(in srgb, var(--accent2) 40%, transparent);
    transition:filter .12s,transform .08s;-webkit-app-region:no-drag;
  }
  .hero-btn:hover { filter:brightness(1.08); }
  .hero-btn:active { transform:scale(.97); }
  .hero-btn.ghost {
    background:transparent;color:var(--text2);border:1px solid var(--border);
    box-shadow:none;padding:9px 11px;
  }
  .hero-btn.ghost:hover { background:var(--bg3);color:var(--text); }

  .section-label { font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px; }

  .tasks-list { display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto;padding-right:4px; }

  .task-row-wrap { display:flex;flex-direction:column;flex-shrink:0; }
  .task-row { display:flex;align-items:center;gap:8px; }
  .task-row .task-pill { flex:1;min-width:0; }

  /* El nombre puede ser largo: baja de línea para mostrarse entero (no se recorta).
     Doble clic para renombrarlo en el sitio. */
  .task-name { min-width:0;white-space:normal;overflow-wrap:anywhere; }
  .rename-input {
    width:100%;background:var(--bg);border:1px solid var(--accent);border-radius:6px;
    color:var(--text);font-family:inherit;font-size:14px;font-weight:500;padding:2px 6px;
    outline:none;-webkit-app-region:no-drag;
  }

  .task-pill-inner { display:flex;align-items:center;gap:10px;width:100%; }
  .task-pill-actions { display:flex;gap:4px; }

  /* ── Subtareas ─────────────────────────────────────────────────────────── */
  .task-chevron {
    width:16px;height:16px;flex-shrink:0;color:var(--text2);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .16s ease,color .12s;
  }
  .task-chevron:hover { color:var(--text); }
  .task-chevron.open { transform:rotate(90deg); }
  .task-chevron.empty { opacity:.4; }
  .subtasks {
    display:flex;flex-direction:column;gap:4px;
    margin:5px 0 2px 28px;padding-left:11px;
    border-left:1.5px solid var(--border);
  }
  .sub-row {
    display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:8px;
    -webkit-app-region:no-drag;
  }
  .sub-row:hover { background:var(--bg3); }
  .sub-row.active { background:color-mix(in srgb, var(--accent2) 20%, transparent); }
  .sub-name { flex:1;min-width:0;font-size:12.5px;line-height:1.35;overflow-wrap:anywhere; }
  .sub-time { font-size:11.5px;color:var(--text2);font-variant-numeric:tabular-nums;flex-shrink:0; }
  .sub-row .icon-btn { width:22px;height:22px;opacity:0; }
  .sub-row:hover .icon-btn, .sub-row.active .icon-btn { opacity:1; }
  .sub-row .icon-btn.play { opacity:1; }
  .sub-add {
    display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:8px;
    background:transparent;border:1px dashed var(--border);color:var(--text2);
    font-family:inherit;font-size:12px;cursor:pointer;-webkit-app-region:no-drag;
  }
  .sub-add:hover { color:var(--text);border-color:var(--accent);border-style:solid; }
  .sub-input {
    flex:1;background:var(--bg);border:1px solid var(--accent);border-radius:7px;
    color:var(--text);font-family:inherit;font-size:12.5px;padding:5px 8px;outline:none;
  }

  /* ── Accesos rápidos ───────────────────────────────────────────────────── */
  .quick-grid {
    display:grid;grid-template-columns:1fr 1fr;gap:8px;flex-shrink:0;margin-top:10px;
  }
  .quick-btn {
    display:flex;align-items:center;gap:9px;padding:11px 12px;
    background:var(--bg2);border:1px solid var(--border);border-radius:11px;
    color:var(--text);font-family:inherit;font-size:12.5px;font-weight:600;
    cursor:pointer;text-align:left;transition:background .12s,border-color .12s,transform .08s;
    -webkit-app-region:no-drag;
  }
  .quick-btn:hover { background:var(--bg3);border-color:color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .quick-btn:active { transform:scale(.98); }
  .quick-btn svg { flex-shrink:0;color:var(--accent); }
  .quick-btn span { min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
  .quick-btn:disabled { opacity:.4;cursor:default; }
  .quick-btn:disabled:hover { background:var(--bg2);border-color:var(--border); }
  .icon-btn {
    background:transparent;border:none;cursor:pointer;color:var(--text2);
    width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    transition:all .12s;-webkit-app-region:no-drag;
  }
  .icon-btn:hover { background:var(--bg3);color:var(--text); }
  .icon-btn.is-playing { color:var(--danger); }
  .icon-btn.is-stopped { color:var(--success); }

  .new-task-area { border-top:1px solid var(--border);padding-top:14px;display:flex;flex-direction:column;gap:8px; }

  .empty-state { text-align:center;color:var(--text2);font-size:14px;padding:30px 0; }

  .playing-badge {
    display:inline-flex;align-items:center;gap:5px;
    background:rgba(52,211,153,.15);border:1px solid rgba(52,211,153,.3);
    border-radius:20px;font-size:11px;color:var(--success);padding:3px 10px;
    /* Es solo informativo (la tarea activa ya sale en el subtítulo). Sin esto, al
       colgar sobre los botones de abajo les robaba el clic en su mitad superior. */
    pointer-events:none;
  }
  .playing-badge .dot { width:6px;height:6px;border-radius:50%;background:var(--success);animation:pulse2 1.4s ease-in-out infinite; }
  @keyframes pulse2 { 0%,100%{opacity:1}50%{opacity:.3} }

  /* Nota rápida de la tarea en curso: solo visible mientras hay una activa. Se guarda en
     la entrada que está corriendo y se ve reflejada en el calendario; al pausar se borra
     sola (la siguiente vez que se retome la tarea se supone que será otra cosa). */
  .active-note-row { display:none;align-items:center;gap:8px;width:100%;-webkit-app-region:no-drag; }
  .active-note-row svg { flex-shrink:0;color:var(--text2); }
  .active-note-row input { flex:1; }

  /* Barra roja de actualización (solo visible si hay una versión nueva) */
  .update-bar {
    display:none;align-items:center;justify-content:center;gap:8px;width:100%;
    background:var(--danger);color:#1a1a24;font-size:13px;font-weight:700;padding:11px 12px;
    border-radius:var(--radius-sm);cursor:pointer;-webkit-app-region:no-drag;border:none;
    animation:updatePulse 2s ease-in-out infinite;
  }
  .update-bar:hover { background:color-mix(in srgb, var(--danger) 82%, #000);color:#fff; }
  @keyframes updatePulse { 0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--danger) 55%, transparent)} 70%{box-shadow:0 0 0 7px transparent} }
</style>
</head>
<body>
<div class="app animate-in">
  <div class="win-drag" title="Arrastra para mover la ventana"></div>


  <!-- Window controls: — × -->
  <div class="win-controls">
    <button class="win-btn" onclick="minimize()" title="Minimizar">
      <svg width="10" height="2" viewBox="0 0 10 2"><rect width="10" height="2" rx="1" fill="currentColor"/></svg>
    </button>
    <button class="win-btn close" onclick="closeWin()" title="Cerrar">
      <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="titlebar">
    <div class="th-drag">
      <div class="app-title">imputa<span class="brand-dot">.</span>me</div>
      <div class="app-subtitle" id="subtitle">Cargando...</div>
    </div>
  </div>

  <div class="total-banner">
    <div class="total-inline">
      <span class="total-label">Hoy</span>
      <span class="total-time" id="totalTime">0m 00s</span>
    </div>
    <div id="navButtons" style="display:flex;gap:8px;-webkit-app-region:no-drag">
      <button class="btn-ghost" onclick="openCalendar()" style="font-size:12px;display:inline-flex;align-items:center;gap:6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Calendario
      </button>
      <button class="btn-ghost" onclick="openGroups()" style="font-size:12px;display:inline-flex;align-items:center;gap:6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Guardadas
      </button>
      <button class="btn-ghost" onclick="openSettings()" style="font-size:12px;padding:8px 10px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>

  <div class="hero idle" id="heroCard">
    <div id="heroIdle">
      <div class="hero-idle-title">Nada en marcha</div>
      <div class="hero-idle-text">Dale al play de una tarea de abajo y aparecerá aquí.</div>
    </div>
    <div id="heroLive" style="display:none;flex-direction:column;align-items:center;gap:11px;width:100%">
      <div class="hero-head">
        <div class="hero-dot" id="heroDot" title="Cambiar color"></div>
        <div class="hero-name" id="heroName"></div>
      </div>
      <div class="hero-time" id="heroTime">0m 00s</div>
      <div class="active-note-row" id="activeNoteRow">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H9l-5 5z"/></svg>
        <input type="text" id="activeNoteInput" placeholder="¿Qué estás haciendo ahora mismo?" maxlength="500">
      </div>
      <div class="hero-actions">
        <button class="hero-btn" id="heroPause">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="2" y="1" width="3" height="10" rx="1"/><rect x="7" y="1" width="3" height="10" rx="1"/></svg>
          Pausar
        </button>
        <button class="hero-btn ghost" id="heroRename" title="Cambiar el nombre">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <button class="update-bar" id="updateBtn" onclick="openUpdate()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 21h16"/></svg>
    <span id="updateBarText">Hay una actualización disponible</span>
  </button>

  <div style="flex:1;min-height:0;display:flex;flex-direction:column;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
      <div class="section-label" style="margin-bottom:0">Tareas</div>
      <div class="back-row" style="margin:0;flex-wrap:wrap;row-gap:4px">
        <span class="back-label">Al iniciar, llevo:</span>
        <input type="number" id="startBackMin" placeholder="0" min="0" max="600"
          style="width:52px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:12px;padding:4px 7px;outline:none;-webkit-app-region:no-drag;text-align:center">
        <span class="back-label">min</span>
        <span class="back-label">o desde:</span>
        <input type="time" id="startBackTime"
          style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:12px;padding:4px 7px;outline:none;-webkit-app-region:no-drag;color-scheme:dark">
      </div>
    </div>
    <div class="tasks-list no-drag" id="tasksList">
      <div class="empty-state">Sin tareas. Crea una abajo ↓</div>
    </div>

    <div class="quick-grid no-drag" id="quickGrid">
      <button class="quick-btn" onclick="openCalendar()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span>Calendario</span>
      </button>
      <button class="quick-btn" onclick="openGroups()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>Guardadas</span>
      </button>
      <button class="quick-btn" id="quickResume" onclick="reanudarUltima()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        <span id="quickResumeText">Reanudar la última</span>
      </button>
      <button class="quick-btn" onclick="openSettings()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Ajustes</span>
      </button>
    </div>
  </div>

  <div class="new-task-area">
    <button class="btn-primary" onclick="openGroups()" style="width:100%;display:flex;align-items:center;justify-content:center;gap:6px">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Añadir tarea
    </button>
  </div>

  <div class="popup-backdrop" id="colorPopupBackdrop" style="display:none" onclick="closeColorPopup()"></div>
  <div class="entry-popup" id="colorPopup" style="display:none">
    <div class="entry-popup-title">Color de la tarea</div>
    <div class="color-row" id="colorPopupPicker"></div>
    <div class="entry-popup-actions">
      <div style="flex:1"></div>
      <button class="btn-ghost" onclick="closeColorPopup()">Cerrar</button>
    </div>
  </div>

  <div class="popup-backdrop" id="archivePopupBackdrop" style="display:none" onclick="closeArchivePopup()"></div>
  <div class="entry-popup" id="archivePopup" style="display:none">
    <div class="entry-popup-title">Guardar en un grupo</div>
    <select id="archiveGroupSelect" onchange="onArchiveGroupChange()"></select>
    <div id="archiveNewGroupFields" style="display:none;flex-direction:column;gap:8px">
      <input type="text" id="archiveNewGroupName" placeholder="Nombre del grupo nuevo..." maxlength="60">
    </div>
    <div class="entry-popup-actions">
      <div style="flex:1"></div>
      <button class="btn-ghost" onclick="closeArchivePopup()">Cancelar</button>
      <button class="btn-primary" onclick="confirmArchive()">Guardar</button>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
const { ipcRenderer } = require('electron');

let currentState = null;
let ticker = null;
let colorPopupTaskId = null;
let archivePopupTaskId = null;
let lastNoteTaskId = null;

const SVG_PLAY = `<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M3 2l7 4-7 4V2z"/></svg>`;
const SVG_PAUSE = `<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="2" y="1" width="3" height="10" rx="1"/><rect x="7" y="1" width="3" height="10" rx="1"/></svg>`;

function fmt(secs) {
  const h=Math.floor(secs/3600),m=Math.floor((secs%3600)/60),s=secs%60;
  if(h>0) return `${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
  return `${m}m ${String(s).padStart(2,'0')}s`;
}

let tutorialActive = false;
// isViewVisibleToUser(): dentro de la barra flotante esta vista existe aunque el panel
// esté plegado. Si el tutorial arrancase ahí, daría sus pasos por vistos sin que nadie
// los haya visto, así que se espera a que el panel se despliegue.
function maybeStartTutorial() {
  if (tutorialActive || !currentState || !isViewVisibleToUser()) return;
  const seen = (currentState.settings && currentState.settings.tutorialSeenSteps) || [];
  tutorialActive = startTutorialIfNeeded('main', seen, () => { tutorialActive = false; });
}
window.addEventListener('dock-expanded', maybeStartTutorial);
window.addEventListener('tutorial-tour', maybeStartTutorial);
ipcRenderer.on('state', (_, state) => {
  currentState = state; render(state);
  maybeStartTutorial();
});
ipcRenderer.send('action', { type: 'get-state' });

const SVG_SAVE = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`;
const SVG_PENCIL = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>`;
const SVG_SUB_DEL = `<svg width="11" height="11" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;

let lastRenderedIds = null;

// Tareas con las subtareas desplegadas. Solo mientras dure la ventana: es un gesto de
// consulta, no un ajuste que merezca guardarse en disco.
const subsAbiertas = new Set();

function buildRow(t, state) {
  const isActive = t.id === state.activeTaskId;
  const nSubs = (t.subtasks || []).length;
  const abierta = subsAbiertas.has(t.id);
  const row = document.createElement('div');
  row.className = 'task-row-wrap';
  row.dataset.taskId = t.id;

  const linea = document.createElement('div');
  linea.className = 'task-row';

  const pill = document.createElement('div');
  pill.className = 'task-pill' + (isActive?' active':'');
  pill.innerHTML = `
    <div class="task-pill-inner">
      <div class="task-chevron ${abierta ? 'open' : ''} ${nSubs ? '' : 'empty'}" title="${nSubs ? 'Ver las subtareas' : 'Añadir subtareas'}">
        <svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 1l4 4-4 4"/></svg>
      </div>
      <div class="task-dot" style="background:${t.color};cursor:pointer" title="Cambiar color" onclick="event.stopPropagation();openColorPopup('${t.id}')"></div>
      <span class="task-name">${t.name}</span>
      <span class="task-time">${fmt(t.todaySecs)}</span>
      <div class="task-pill-actions">
        <button class="icon-btn" title="Cambiar el nombre" onclick="event.stopPropagation();startRename('${t.id}')">
          ${SVG_PENCIL}
        </button>
        <button class="icon-btn" title="Guardar en un grupo" onclick="event.stopPropagation();archiveTask('${t.id}')">
          ${SVG_SAVE}
        </button>
        <button class="icon-btn ${isActive?'is-playing':'is-stopped'}" title="${isActive?'Pausar':'Iniciar'}"
          onclick="switchTask('${t.id}')">
          ${isActive ? SVG_PAUSE : SVG_PLAY}
        </button>
      </div>
    </div>`;

  const del = document.createElement('button');
  del.className = 'btn-danger';
  del.innerHTML = `<svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`;
  del.style.cssText = 'padding:7px 9px;';
  del.onclick = () => {
    if (confirm(`¿Eliminar "${t.name}"?\nIrá a la papelera (en Guardadas): podrás restaurarla durante 30 días.`))
      ipcRenderer.send('action', { type:'delete-task', payload:{ taskId:t.id } });
  };
  const nameEl = pill.querySelector('.task-name');
  if (nameEl) {
    nameEl.title = t.name;   // renombrar es cosa del lápiz de la fila
  }

  linea.appendChild(pill);
  linea.appendChild(del);
  row.appendChild(linea);

  pill.querySelector('.task-chevron').onclick = (e) => {
    e.stopPropagation();
    if (subsAbiertas.has(t.id)) subsAbiertas.delete(t.id); else subsAbiertas.add(t.id);
    lastRenderedIds = null;      // cambia la estructura, no solo los textos: hay que reconstruir
    render(currentState);
  };
  if (abierta) row.appendChild(buildSubtasks(t, state));
  return row;
}

// Subtareas de una tarea ("Cocina" → horno, frigorífico...). Cada una lleva su tiempo
// de hoy y su propio play: arrancarla es arrancar la tarea, pero apuntando la entrada
// a ella, así que el total de la tarea sigue siendo la suma de todo lo de dentro.
function buildSubtasks(t, state) {
  const wrap = document.createElement('div');
  wrap.className = 'subtasks';

  (t.subtasks || []).forEach(sub => {
    const activa = t.id === state.activeTaskId && sub.id === state.activeSubId;
    const fila = document.createElement('div');
    fila.className = 'sub-row' + (activa ? ' active' : '');
    fila.innerHTML = `
      <span class="sub-name">${sub.name}</span>
      <span class="sub-time">${fmt(sub.todaySecs)}</span>
      <button class="icon-btn" title="Cambiar el nombre">${SVG_PENCIL}</button>
      <button class="icon-btn" title="Eliminar subtarea">${SVG_SUB_DEL}</button>
      <button class="icon-btn play ${activa ? 'is-playing' : 'is-stopped'}" title="${activa ? 'Pausar' : 'Iniciar'}">${activa ? SVG_PAUSE : SVG_PLAY}</button>`;
    const botones = fila.querySelectorAll('.icon-btn');
    botones[0].onclick = (e) => { e.stopPropagation(); renombrarSubtarea(t, sub); };
    botones[1].onclick = (e) => {
      e.stopPropagation();
      const aviso = '¿Eliminar la subtarea "' + sub.name + '"?\nEl tiempo que ya lleva NO se pierde: sigue contando en "' + t.name + '" y en el calendario.';
      if (confirm(aviso))
        ipcRenderer.send('action', { type:'delete-subtask', payload:{ taskId: t.id, subId: sub.id } });
    };
    botones[2].onclick = (e) => { e.stopPropagation(); switchTask(t.id, sub.id); };
    wrap.appendChild(fila);
  });

  const add = document.createElement('button');
  add.className = 'sub-add';
  add.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Añadir subtarea';
  add.onclick = (e) => { e.stopPropagation(); nuevaSubtarea(t, add); };
  wrap.appendChild(add);
  return wrap;
}

// El nombre se escribe en el sitio, sin popup: son cosas cortas ("horno", "frigorífico").
function nuevaSubtarea(t, boton) {
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'sub-input';
  input.placeholder = 'Nombre de la subtarea...';
  input.maxLength = 120;
  boton.replaceWith(input);
  input.focus();
  let hecho = false;
  const cerrar = (guardar) => {
    if (hecho) return; hecho = true;
    const val = input.value.trim();
    input.replaceWith(boton);
    if (guardar && val) ipcRenderer.send('action', { type:'add-subtask', payload:{ taskId: t.id, name: val } });
  };
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') cerrar(true);
    if (e.key === 'Escape') cerrar(false);
  });
  input.addEventListener('blur', () => cerrar(true));
}

function renombrarSubtarea(t, sub) {
  const val = prompt('Nuevo nombre para la subtarea:', sub.name);
  if (val === null) return;
  const n = val.trim();
  if (!n || n === sub.name) return;
  ipcRenderer.send('action', { type:'rename-subtask', payload:{ taskId: t.id, subId: sub.id, name: n } });
}

// Renombrado en el sitio: convierte el nombre en un textbox editable.
function startRename(taskId) {
  const row = document.querySelector(`[data-task-id="${taskId}"]`);
  if (!row) return;
  const nameEl = row.querySelector('.task-name');
  if (!nameEl || nameEl.querySelector('input')) return;
  const task = currentState && currentState.tasks.find(t => t.id === taskId);
  const current = task ? task.name : nameEl.textContent;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'rename-input';
  input.maxLength = 120;
  input.value = current;
  nameEl.textContent = '';
  nameEl.appendChild(input);
  input.focus();
  input.select();
  let done = false;
  const commit = (save) => {
    if (done) return; done = true;
    const val = input.value.trim();
    if (save && val && val !== current) {
      nameEl.textContent = val;   // optimista; el próximo state lo confirma
      ipcRenderer.send('action', { type:'rename-task', payload:{ taskId, name: val } });
    } else {
      nameEl.textContent = current;
    }
    nameEl.title = nameEl.textContent + ' — doble clic para renombrar';
  };
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); commit(true); }
    else if (e.key === 'Escape') { e.preventDefault(); commit(false); }
  });
  input.addEventListener('blur', () => commit(true));
  input.addEventListener('click', e => e.stopPropagation());
  input.addEventListener('dblclick', e => e.stopPropagation());
}

// Tarjeta de la tarea en marcha. Cuando no hay ninguna, la misma caja explica qué hacer
// en vez de desaparecer y dejar el panel dando saltos de altura.
function renderHero(active) {
  const card = document.getElementById('heroCard');
  const idle = document.getElementById('heroIdle');
  const live = document.getElementById('heroLive');
  if (!card) return;
  card.classList.toggle('idle', !active);
  idle.style.display = active ? 'none' : 'block';
  live.style.display = active ? 'flex' : 'none';
  if (!active) return;

  // Si hay una subtarea en marcha, manda ella: es lo que estás haciendo de verdad, y
  // la tarea queda arriba como contexto ("Cocina" → horno).
  const sub = (active.subtasks || []).find(x => x.id === currentState.activeSubId);
  const nameEl = document.getElementById('heroName');
  const rotulo = sub ? `${active.name} · ${sub.name}` : active.name;
  if (nameEl.textContent !== rotulo) { nameEl.textContent = rotulo; nameEl.title = rotulo; }
  document.getElementById('heroTime').textContent = fmt(sub ? sub.todaySecs : active.todaySecs);
  document.getElementById('heroDot').style.background = active.color;
  document.getElementById('heroDot').onclick = () => openColorPopup(active.id);
  document.getElementById('heroPause').onclick = () => switchTask(active.id);
  document.getElementById('heroRename').onclick = () => renameActiveTask(active);
}

// La tarea en marcha no está en la lista de abajo, así que su renombrado se hace en un
// prompt en vez de convirtiendo el nombre en un campo.
function renameActiveTask(task) {
  const val = prompt('Nuevo nombre para la tarea:', task.name);
  if (val === null) return;
  const n = val.trim();
  if (!n || n === task.name) return;
  ipcRenderer.send('action', { type:'rename-task', payload:{ taskId: task.id, name: n.slice(0, 120) } });
}

function updateRowContent(row, t, state) {
  const isActive = t.id === state.activeTaskId;
  const pill = row.querySelector('.task-pill');
  pill.classList.toggle('active', isActive);
  const dot = pill.querySelector('.task-dot');
  if (dot) dot.style.background = t.color;
  const nameEl = pill.querySelector('.task-name');
  if (nameEl && !nameEl.querySelector('input') && nameEl.textContent !== t.name) {
    nameEl.textContent = t.name;
    nameEl.title = t.name;
  }
  const timeEl = pill.querySelector('.task-time');
  if (timeEl) timeEl.textContent = fmt(t.todaySecs);
  const playBtn = pill.querySelector('.task-pill-actions .icon-btn:last-child');
  if (playBtn) {
    playBtn.className = 'icon-btn ' + (isActive ? 'is-playing' : 'is-stopped');
    playBtn.title = isActive ? 'Pausar' : 'Iniciar';
    playBtn.innerHTML = isActive ? SVG_PAUSE : SVG_PLAY;
  }
  // Si la tarea tiene las subtareas desplegadas, sus cronómetros también corren.
  const filas = row.querySelectorAll('.subtasks .sub-row');
  if (filas.length) {
    (t.subtasks || []).forEach((sub, i) => {
      const fila = filas[i];
      if (!fila) return;
      const tiempo = fila.querySelector('.sub-time');
      if (tiempo) tiempo.textContent = fmt(sub.todaySecs);
      const activa = isActive && sub.id === state.activeSubId;
      fila.classList.toggle('active', activa);
      const play = fila.querySelector('.icon-btn.play');
      if (play) {
        play.className = 'icon-btn play ' + (activa ? 'is-playing' : 'is-stopped');
        play.title = activa ? 'Pausar' : 'Iniciar';
        play.innerHTML = activa ? SVG_PAUSE : SVG_PLAY;
      }
    });
  }
}

function render(state) {
  const visibleTasks = state.tasks.filter(t => !t.archived && !t.deleted);
  const active = state.tasks.find(t => t.id === state.activeTaskId);
  document.getElementById('totalTime').textContent = fmt(state.todayTotal);
  document.getElementById('subtitle').textContent = `${visibleTasks.length} tarea(s)`;

  const upBtn = document.getElementById('updateBtn');
  if (upBtn) {
    if (state.updateAvailable) {
      upBtn.style.display = 'flex';
      document.getElementById('updateBarText').textContent = `Actualizar a la versión ${state.updateAvailable.version}`;
    } else {
      upBtn.style.display = 'none';
    }
  }
  renderHero(active);

  const resumeBtn = document.getElementById('quickResume');
  if (resumeBtn) {
    const ult = ultimaTarea();
    const puede = !!ult && ult.id !== state.activeTaskId;
    resumeBtn.disabled = !puede;
    document.getElementById('quickResumeText').textContent =
      puede ? `Reanudar ${ult.name}` : 'Reanudar la última';
    resumeBtn.title = puede ? `Volver a poner en marcha "${ult.name}"` : '';
  }
  // Dentro de la barra flotante la navegación ya está arriba en las pestañas: repetirla
  // aquí y otra vez abajo eran tres sitios para lo mismo.
  const nav = document.getElementById('navButtons');
  if (nav) nav.style.display = IS_EMBEDDED ? 'none' : 'flex';

  const noteRow = document.getElementById('activeNoteRow');
  const noteInput = document.getElementById('activeNoteInput');
  if (active) {
    noteRow.style.display = 'flex';
    // Solo rellenamos el campo cuando CAMBIA la tarea activa, no en cada refresco (el
    // estado llega cada segundo): si no, le borraríamos al usuario lo que está escribiendo.
    if (active.id !== lastNoteTaskId) {
      lastNoteTaskId = active.id;
      const lastEntry = active.entries[active.entries.length - 1];
      noteInput.value = (lastEntry && lastEntry.note) || '';
    }
  } else {
    noteRow.style.display = 'none';
    lastNoteTaskId = null;
  }

  const list = document.getElementById('tasksList');
  // La tarea en marcha ya está arriba en grande: abajo va todo lo demás.
  const restantes = visibleTasks.filter(t => t.id !== state.activeTaskId);
  if (!restantes.length) {
    list.innerHTML = `<div class="empty-state">${visibleTasks.length ? 'No tienes más tareas sueltas.' : 'Sin tareas. Crea una abajo ↓'}</div>`;
    lastRenderedIds = null;
    return;
  }

  // Si las tareas visibles son exactamente las mismas que la última vez (mismo orden),
  // actualizamos cada fila en el sitio en vez de destruir y recrear todo el DOM: así,
  // durante el segundo a segundo mientras hay una tarea activa, no se pierde el :hover
  // ni parpadean los botones bajo el cursor (mismo problema que había en el calendario).
  const ids = restantes.map(t => t.id);
  const sameSet = lastRenderedIds && ids.length === lastRenderedIds.length && ids.every((id, i) => id === lastRenderedIds[i]);
  if (sameSet) {
    restantes.forEach(t => {
      const row = list.querySelector(`[data-task-id="${t.id}"]`);
      if (row) updateRowContent(row, t, state);
    });
    return;
  }

  lastRenderedIds = ids;
  list.innerHTML = '';
  restantes.forEach(t => list.appendChild(buildRow(t, state)));
}

if (ticker) clearInterval(ticker);
ticker = setInterval(() => {
  if (!currentState || !currentState.activeTaskId) return;
  const t = currentState.tasks.find(t => t.id === currentState.activeTaskId);
  if (t) { t.todaySecs++; currentState.todayTotal++; render(currentState); }
}, 1000);

let activeNoteDebounce = null;
document.getElementById('activeNoteInput').addEventListener('input', () => {
  clearTimeout(activeNoteDebounce);
  const note = document.getElementById('activeNoteInput').value;
  activeNoteDebounce = setTimeout(() => {
    ipcRenderer.send('action', { type:'set-active-note', payload:{ note } });
  }, 500);
});

// Envía la nota pendiente YA (sin esperar al debounce). Se llama justo antes de
// pausar/cambiar de tarea: si no, una nota escrita en el último medio segundo se
// perdía, porque al llegar el guardado la entrada ya se había cerrado.
function flushActiveNote() {
  if (activeNoteDebounce) { clearTimeout(activeNoteDebounce); activeNoteDebounce = null; }
  if (!currentState || !currentState.activeTaskId) return;
  const note = document.getElementById('activeNoteInput').value;
  ipcRenderer.send('action', { type:'set-active-note', payload:{ note } });
}

// La última que estuvo en marcha: la entrada más reciente de todas manda.
function ultimaTarea() {
  if (!currentState) return null;
  let mejor = null, cuando = -1;
  currentState.tasks.forEach(t => {
    if (t.archived || t.deleted) return;
    t.entries.forEach(e => { if (e.start > cuando) { cuando = e.start; mejor = t; } });
  });
  return mejor;
}

function reanudarUltima() {
  const t = ultimaTarea();
  if (t) switchTask(t.id);
}

function switchTask(taskId, subId) {
  flushActiveNote();   // no perder lo que se acabe de escribir en la nota al pausar/cambiar
  const backMinutes = computeBackMinutes('startBackMin', 'startBackTime');
  ipcRenderer.send('action', { type:'switch-task', payload:{ taskId, subId, backMinutes: backMinutes || undefined } });
  document.getElementById('startBackMin').value = '';
  document.getElementById('startBackTime').value = '';
}
function openUpdate() { ipcRenderer.send('action', { type:'open-update-window' }); }
function openCalendar() { ipcRenderer.send('action', { type:'open-calendar' }); }
function openSettings() { ipcRenderer.send('action', { type:'open-settings' }); }
function openGroups() { ipcRenderer.send('action', { type:'open-groups' }); }
function minimize() { ipcRenderer.send('action', { type:'min-main' }); }
function closeWin() { ipcRenderer.send('action', { type:'close-main' }); }

// ---------- Color de una tarea existente ----------
function openColorPopup(taskId) {
  colorPopupTaskId = taskId;
  const task = currentState && currentState.tasks.find(t => t.id === taskId);
  const picker = document.getElementById('colorPopupPicker');
  picker.innerHTML = '';
  COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (task && task.color === c ? ' selected' : '');
    sw.style.background = c;
    sw.onclick = () => {
      ipcRenderer.send('action', { type:'edit-task-color', payload:{ taskId: colorPopupTaskId, color: c } });
      closeColorPopup();
    };
    picker.appendChild(sw);
  });
  document.getElementById('colorPopupBackdrop').style.display = 'block';
  document.getElementById('colorPopup').style.display = 'flex';
}
function closeColorPopup() {
  document.getElementById('colorPopupBackdrop').style.display = 'none';
  document.getElementById('colorPopup').style.display = 'none';
  colorPopupTaskId = null;
}

// ---------- Guardar tarea en un grupo ----------
function archiveTask(taskId) {
  const task = currentState && currentState.tasks.find(t => t.id === taskId);
  if (!task) return;
  if (task.groupId) {
    ipcRenderer.send('action', { type:'archive-task', payload:{ taskId, groupId: task.groupId } });
  } else {
    openArchivePopup(taskId);
  }
}
function openArchivePopup(taskId) {
  archivePopupTaskId = taskId;
  const select = document.getElementById('archiveGroupSelect');
  select.innerHTML = '';
  const groups = (currentState && currentState.groups) || [];
  groups.forEach(g => {
    const opt = document.createElement('option'); opt.value = g.id; opt.textContent = g.name;
    select.appendChild(opt);
  });
  const newOpt = document.createElement('option'); newOpt.value = '__new__'; newOpt.textContent = '+ Grupo nuevo';
  select.appendChild(newOpt);
  select.value = groups.length ? groups[0].id : '__new__';
  onArchiveGroupChange();
  document.getElementById('archivePopupBackdrop').style.display = 'block';
  document.getElementById('archivePopup').style.display = 'flex';
}
function onArchiveGroupChange() {
  const isNew = document.getElementById('archiveGroupSelect').value === '__new__';
  document.getElementById('archiveNewGroupFields').style.display = isNew ? 'flex' : 'none';
}
function closeArchivePopup() {
  document.getElementById('archivePopupBackdrop').style.display = 'none';
  document.getElementById('archivePopup').style.display = 'none';
  archivePopupTaskId = null;
}
function confirmArchive() {
  const select = document.getElementById('archiveGroupSelect');
  const isNew = select.value === '__new__';
  if (isNew) {
    const name = document.getElementById('archiveNewGroupName').value.trim();
    if (!name) { alert('Ponle un nombre al grupo'); return; }
    ipcRenderer.send('action', { type:'archive-task', payload:{ taskId: archivePopupTaskId, groupName: name } });
  } else {
    ipcRenderer.send('action', { type:'archive-task', payload:{ taskId: archivePopupTaskId, groupId: select.value } });
  }
  document.getElementById('archiveNewGroupName').value = '';
  closeArchivePopup();
}
