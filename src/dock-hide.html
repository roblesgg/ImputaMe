<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  /* Ventanita propia SOLO para el botón de esconder, para que pueda flotar FUERA del
     panel. No puede ir dentro del panel (su ventana lo recortaría) ni dentro de la de la
     barrita (allí dependía de calcular coordenadas entre ventanas y acababa desalineado o
     tapado). Aquí la coloca el proceso principal en coordenadas de pantalla, pegada al
     panel y siguiéndolo también mientras se anima. */
  html, body { width:100%; height:100%; margin:0; background:transparent !important; overflow:hidden; }
  body { -webkit-app-region:no-drag; display:flex; align-items:center; justify-content:center; }

  .btn {
    width:34px; height:34px; border-radius:50%; padding:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface); color:var(--text2);
    border:1px solid color-mix(in srgb, var(--text) 22%, transparent);
    box-shadow:0 4px 18px rgba(0,0,0,.5);
    cursor:pointer;
    transition:background .18s, color .18s, transform .22s cubic-bezier(.34,1.5,.5,1), box-shadow .18s;
  }
  .btn svg { transition:transform .22s cubic-bezier(.34,1.5,.5,1); }
  .btn:hover {
    background:var(--accent2); color:#fff; transform:scale(1.14);
    box-shadow:0 6px 22px color-mix(in srgb, var(--accent2) 60%, transparent);
  }
  .btn:active { transform:scale(.94); }

  /* La flecha apunta hacia el lado por el que se va el panel al esconderse. */
  body.a-left  .btn svg { transform:scaleX(-1); }
  body.a-top   .btn svg { transform:rotate(-90deg); }
  body.a-bottom .btn svg { transform:rotate(90deg); }
  body.a-left  .btn:hover svg { transform:scaleX(-1) translateX(2px); }
  body.a-top   .btn:hover svg { transform:rotate(-90deg) translateX(2px); }
  body.a-bottom .btn:hover svg { transform:rotate(90deg) translateX(2px); }
  body.a-right .btn:hover svg { transform:translateX(2px); }
</style>
</head>
<body class="a-right">
  <button class="btn" id="btn" title="Esconder">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </button>

<script src="shared.js"></script>
<script>
const { ipcRenderer } = require('electron');
const SIDES = ['left','right','top','bottom'];

ipcRenderer.on('dock-config', (_, cfg) => {
  SIDES.forEach(s => document.body.classList.remove('a-' + s));
  document.body.classList.add('a-' + (SIDES.includes(cfg.anchor) ? cfg.anchor : 'right'));
});

document.getElementById('btn').onclick = () => {
  ipcRenderer.send('action', { type: 'dock-collapse-panel' });
};
</script>
</body>
</html>
